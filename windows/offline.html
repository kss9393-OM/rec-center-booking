<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>لا يوجد اتصال · Offline</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f6f9;--card:#fff;--fg:#0f172a;--muted:#64748b;--pri:#0f6b52}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--fg:#e2e8f0;--muted:#94a3b8;--pri:#34d399}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  .card{background:var(--card);padding:32px 28px;border-radius:18px;max-width:420px;margin:16px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  img{width:84px;height:84px;border-radius:18px}
  h1{font-size:20px;margin:16px 0 6px}
  p{color:var(--muted);margin:4px 0;line-height:1.6}
  .en{direction:ltr}
  button{margin-top:18px;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:600;cursor:pointer}
  small{display:block;margin-top:18px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <img src="build/icon.ico" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من الاتصال ثم أعد المحاولة. ستُعاد المحاولة تلقائياً.</p>
    <p class="en">No internet connection. Check the connection and try again.</p>
    <button id="retry">إعادة المحاولة · Retry</button>
    <small>© 2026 Services Squire LLC</small>
  </div>
<script>
  const u = new URLSearchParams(location.search).get('u') || 'https://kss9393-om.github.io/rec-center-booking/';
  const go = () => { location.href = u; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  setTimeout(go, 20000);
</script>
</body>
</html>
