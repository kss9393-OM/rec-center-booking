# Builds the Windows installer and publishes it on the "Windows app" release page.
# © 2026 Services Squire LLC.
name: Windows app

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Build installer
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm run dist
          ls -la dist

      # Not marked "latest", so the Android download link keeps pointing to the Android release.
      - name: Publish to the "Windows app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          NOTES="مركز الترفيه الطلابي لنظام ويندوز — نسخة ${VERSION} · Campus Recreation Center for Windows ${VERSION}. © 2026 Services Squire LLC."
          if gh release view windows-app >/dev/null 2>&1; then
            gh release upload windows-app windows/dist/RecCenter-Setup.exe --clobber
            gh release edit windows-app --title "Windows app ${VERSION}" --notes "$NOTES" --latest=false
          else
            gh release create windows-app windows/dist/RecCenter-Setup.exe --title "Windows app ${VERSION}" --notes "$NOTES" --latest=false
          fi
