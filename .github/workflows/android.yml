# Builds the Android app and publishes it on the "Android app" release page.
# © 2026 Services Squire LLC.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check signing secret
        id: sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ls -la android/app/build/outputs/apk/release/
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::The app built, but it isn't signed: add the ANDROID_KEYSTORE_PASSWORD secret (see README), then re-run this workflow."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            cp android/app/build/outputs/apk/release/app-release.apk rec-center.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the "Android app" release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          NOTES="المركز الترفيهي — نسخة ${VERSION} · Campus Recreation Center app ${VERSION}. © 2026 Services Squire LLC."
          if gh release view android-app >/dev/null 2>&1; then
            gh release upload android-app rec-center.apk --clobber
            gh release edit android-app --title "Android app ${VERSION}" --notes "$NOTES" --latest
          else
            gh release create android-app rec-center.apk --title "Android app ${VERSION}" --notes "$NOTES" --latest
          fi
