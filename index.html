<body>
<title>Rec Center Booking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column app shell — sticky header with view tabs, then a control rail (date / shift / hour) over a 7-zone floor grid; desk view swaps the grid for a gauge + roster. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE5;
  --fg:#111827; --muted:#5B6576; --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --ok:#0E9F6E; --ok-soft:#DDF5EA; --warn:#B7791F; --warn-soft:#FBEFD5; --bad:#D9344F; --bad-soft:#FBE1E6;
  --felt:#0F5F4A;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F19; --surface:#121827; --surface-2:#1A2234; --line:#263049;
  --fg:#E7EBF3; --muted:#93A0B8; --accent:#6E8FFF; --accent-ink:#0B0F19; --accent-soft:#1D2950;
  --ok:#34D399; --ok-soft:#10322A; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#FB7185; --bad-soft:#3D1A24;
  --felt:#1E8C6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F19; --surface:#121827; --surface-2:#1A2234; --line:#263049;
  --fg:#E7EBF3; --muted:#93A0B8; --accent:#6E8FFF; --accent-ink:#0B0F19; --accent-soft:#1D2950;
  --ok:#34D399; --ok-soft:#10322A; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#FB7185; --bad-soft:#3D1A24;
  --felt:#1E8C6C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:10px;background:var(--felt);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;font-weight:600;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.tabs{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lang{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px}
.installBtn{background:var(--felt);border-color:var(--felt);color:#fff}

main{padding-block:20px 48px;display:grid;gap:20px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:13.5px}
.banner b{color:var(--warn)}
.banner.ok{background:var(--ok-soft)}.banner.ok b{color:var(--ok)}

.rail{display:grid;gap:12px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:center;min-width:64px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip .d1{display:block;font-size:12px;opacity:.8}
.chip .d2{display:block;font-family:var(--f-display);font-weight:600;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button+button{border-inline-start:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zone{position:relative;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.zone:not(:disabled):hover{border-color:var(--accent)}
.zone:disabled{cursor:not-allowed}
.zone .hd{display:flex;align-items:center;gap:10px}
.zone .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg);flex:none}
.zone h3{font-size:16px;font-weight:600;line-height:1.25}
.zone .sub{font-size:12.5px;color:var(--muted)}
.seats{display:flex;flex-wrap:wrap;gap:4px}
.seat{width:12px;height:12px;border-radius:3px;background:var(--line)}
.seat.free{background:var(--st)}
.zone .ft{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1;color:var(--st)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--stsoft);color:var(--st);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{--st:var(--ok);--stsoft:var(--ok-soft)}
.s-warn{--st:var(--warn);--stsoft:var(--warn-soft)}
.s-bad{--st:var(--bad);--stsoft:var(--bad-soft)}
.s-acc{--st:var(--accent);--stsoft:var(--accent-soft)}
.s-mut{--st:var(--muted);--stsoft:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:17px;font-weight:600;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500}
.field input,.field select,.search{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13.5px;color:var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:9px}

.scrim{position:fixed;inset:0;background:rgba(5,8,15,.55);z-index:20;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:440px;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.modal.wide{max-width:640px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal h2{font-size:19px;font-weight:600}
.recap{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:13px}

/* Ticket */
.ticket{display:grid;grid-template-columns:1fr auto;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;position:relative}
.ticket .main{padding:18px;display:grid;gap:12px;min-width:0}
.ticket .stub{padding:18px;display:grid;place-items:center;gap:8px;border-inline-start:2px dashed var(--line);position:relative;background:var(--surface-2)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--surface);inset-inline-start:-11px}
.ticket .stub::before{top:-11px}.ticket .stub::after{bottom:-11px}
.qr{width:132px;height:132px;background:#fff;padding:8px;border-radius:8px}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ticket .band{height:6px;background:var(--felt);grid-column:1/-1}
@media (max-width:520px){.ticket{grid-template-columns:1fr}.ticket .stub{border-inline-start:0;border-top:2px dashed var(--line)}.ticket .stub::before,.ticket .stub::after{display:none}}

/* Desk */
.deskTop{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px}
@media (max-width:760px){.deskTop{grid-template-columns:1fr}}
.gauge{display:grid;place-items:center;gap:6px;text-align:center}
.gauge svg{width:180px;height:auto}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.late td{background:var(--warn-soft)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none;padding-inline:16px}
.toast div{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500}
.mine{display:grid;gap:10px}
.mineRow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.logo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
@media (max-width:640px){.topin{gap:8px 8px}.topin .brand{flex:1 1 0;min-width:0}.topin .lang{order:1;padding:6px 9px;font-size:12.5px}.topin .tabs{order:2;flex:1 1 100%}.topin .tabs button{flex:1}.brand h1{font-size:15px}.brand small{display:none}}
.chip.off{border-style:dashed;color:var(--muted)}
.chip.off[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.offTag{font-size:10.5px;color:var(--bad);font-weight:600}
.chip.off[aria-pressed="true"] .offTag{color:inherit}
.closedBox{background:var(--bad-soft);border-color:transparent;display:grid;gap:6px}
.closedBox h2{color:var(--bad);margin:0}

/* Settings */
.sgrid{display:grid;gap:14px}
.sgrid h2{margin:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.logoBox{width:88px;height:88px;border-radius:16px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--bg);flex:none;overflow:hidden}
.logoBox img{width:100%;height:100%;object-fit:contain}
.zlist{display:grid;gap:10px}
.zrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 92px auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.zrow input,.hrow input{background:var(--surface)}
.icons{display:flex;gap:4px;flex-wrap:wrap}
.icons button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.icons button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.icons svg{width:18px;height:18px}
.hrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hrow .tf{flex:1 1 120px;min-width:0}
.crow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:10px;align-items:center}
.rm{align-self:end}
.hrow .rm{margin-inline-start:auto}
.loginBox{max-width:420px;width:100%;margin:24px auto}
/* chat */
.chatLog{display:flex;flex-direction:column;gap:8px;max-height:380px;min-height:160px;overflow-y:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.bub{max-width:80%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;border-start-start-radius:4px;padding:8px 12px;display:grid;gap:2px}
.bub.own{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-start-start-radius:14px;border-start-end-radius:4px}
.bub .bh{font-size:11.5px;font-weight:600;color:var(--muted)}
.bub .bt{white-space:pre-wrap;overflow-wrap:anywhere}
.bub .bm{font-size:11px;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:44px}
.msgGrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;min-height:480px}
.tlist{display:grid;gap:8px;align-content:start;border-inline-end:1px solid var(--line);padding-inline-end:16px;min-width:0}
.tscroll{display:grid;gap:4px;max-height:520px;overflow-y:auto}
.trow{text-align:start;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 10px;display:grid;gap:2px;min-width:0}
.trow:hover{background:var(--surface-2)}
.trow.on{background:var(--accent-soft);border-color:var(--accent)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.tpane{display:grid;gap:10px;align-content:start;min-width:0}
.tpane .chatLog{max-height:460px;min-height:300px}
.backBtn{display:none}
@media (max-width:760px){.msgGrid{grid-template-columns:1fr}.tlist{border:0;padding:0}.msgGrid.hasSel .tlist{display:none}.msgGrid:not(.hasSel) .tpane{display:none}.backBtn{display:inline-flex}}
.authBrand{display:grid;justify-items:center;text-align:center;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.authBrand img,.authBrand .mark{width:72px;height:72px;border-radius:18px;object-fit:contain}
.authBrand img{background:#fff}
.authBrand .nm{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.3;text-wrap:balance}
.authBrand .sb{color:var(--muted);font-size:14px}
.foot{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.foot span:first-child{font-weight:600;color:var(--fg)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.prof summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.prof summary::-webkit-details-marker{display:none}
.prof summary::after{content:"+";font-size:20px;color:var(--muted)}
.prof[open] summary::after{content:"–"}
.prof summary h2{margin:0}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;margin-inline-start:4px}
.msg{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.msg.unread{border-color:var(--accent);background:var(--accent-soft);cursor:pointer}
.pickZones{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pz{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:start}
.pz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pz:disabled{opacity:.45;cursor:not-allowed}
.chip:disabled{opacity:.45}
details summary{list-style-position:inside}
.signbar{gap:8px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

    {id:'ps',icon:'ps',cap:10,ar:'بلايستيشن',en:'PlayStation'},

// Live config (replaced whenever the shared settings change)
let CFG=DEFAULT_CFG, SECTIONS=CFG.sections, SLOTS=CFG.slots, TOTAL=0;
function normCfg(c){
  c=c||{};
  const out={...DEFAULT_CFG,...c,name:{...DEFAULT_CFG.name,...(c.name||{})}};
  out.sections=Array.isArray(c.sections)&&c.sections.length?c.sections:DEFAULT_CFG.sections;
  out.slots=(Array.isArray(c.slots)&&c.slots.length?c.slots:DEFAULT_CFG.slots).slice().sort((a,b)=>toMin(a.s)-toMin(b.s));
  out.weeklyOff=Array.isArray(c.weeklyOff)?c.weeklyOff:[];
  out.weeklyOffReasons=c.weeklyOffReasons&&typeof c.weeklyOffReasons==='object'&&!Array.isArray(c.weeklyOffReasons)?c.weeklyOffReasons:{};
  out.closedSlots=Array.isArray(c.closedSlots)?c.closedSlots:[];
  out.zoneClosures=Array.isArray(c.zoneClosures)?c.zoneClosures:[];
  out.closed=Array.isArray(c.closed)?c.closed:[];
  {const n=parseInt(c.bookAhead,10);out.bookAhead=Number.isFinite(n)?Math.max(0,Math.min(30,n)):DEFAULT_CFG.bookAhead}
  return out;
}
function applyCfg(c){CFG=normCfg(c);SECTIONS=CFG.sections;SLOTS=CFG.slots;TOTAL=SECTIONS.reduce((a,s)=>a+(+s.cap||0),0);return CFG}
function closedInfo(iso){
  const hit=CFG.closed.find(x=>x.date===iso);if(hit) return {reason:hit.reason||''};
  const wd=new Date(iso+'T12:00:00').getDay();if(CFG.weeklyOff.includes(wd)) return {reason:(CFG.weeklyOffReasons||{})[wd]||'',weekly:true};
  return null;
}
const LATE_MIN=10;
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const slotById=id=>SLOTS.find(s=>s.id===id)||{id,shift:'m',s:'00:00',e:'00:00',gone:true};
const secById=id=>SECTIONS.find(s=>s.id===id)||{id,icon:'other',cap:0,ar:id,en:id,gone:true};
applyCfg(DEFAULT_CFG);

// 'past' = booking window closed (10 min after start) ; 'live' = in progress ; 'ended' ; 'future'
function slotPhase(date,slot,tick){
  const t=todayISO();
  if(date<t) return 'ended';
  if(date>t) return 'future';
  const n=nowMin(), s=toMin(slot.s), e=toMin(slot.e);
  if(n>=e) return 'ended';
  if(n>=s) return n>=s+LATE_MIN?'closing':'live';
  return 'future';
}
function slotClosure(date,slotId){return (CFG.closedSlots||[]).find(c=>c.date===date&&(c.slots||[]).map(Number).includes(+slotId))||null}
function zoneClosure(date,secId){return (CFG.zoneClosures||[]).find(z=>z.section===secId&&(z.from||'')<=date&&(!z.to||z.to>=date))||null}
const canBookSlot=(date,slot)=>{if(slot.gone||closedInfo(date)||slotClosure(date,slot.id)) return false;const p=slotPhase(date,slot);return p==='future'||p==='live'};

function effStatus(b,desk){
  if(!b) return null;
  if(b.status==='cancelled') return 'cancelled';
  if(desk && desk.code===b.code) return desk.status;
  return b.status||'booked';
}
const occupies=st=>st==='booked'||st==='checked-in';
function ticketBadge(b,desk){
  const st=effStatus(b,desk);
  if(st==='booked'){const sl=slotById(b.slotId);if(slotPhase(b.date,sl)==='ended') return 'expired';return 'active'}
  return st; // checked-in | cancelled | no-show
}
function makeCode(date){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';
  const buf=new Uint32Array(4);(crypto&&crypto.getRandomValues)?crypto.getRandomValues(buf):buf.forEach((_,i)=>buf[i]=Math.random()*1e9);
  buf.forEach(v=>r+=A[v%A.length]);
  return `CRC-${date.slice(0,4)}-${r}`;
}

const CRC_ERRS=['restricted','dup','full','closed_day','slot_closed','bad_slot','bad_section','locked','not_found','forbidden','no_student','too_far'];
function errCode(e){const m=String((e&&(e.message||e.error_description||e.msg))||'');return CRC_ERRS.find(c=>m.includes(c))||'generic'}
function makeSupabaseStore(C){
  const opts=key=>({auth:{storageKey:key,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const stu=supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,opts('crc-student'));
  const stf=supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,opts('crc-staff'));
  const sEmail=sid=>`${sid}@${C.studentEmailDomain||'students.example.com'}`;
  const tEmail=u=>`${u}@${C.staffEmailDomain||'staff.example.com'}`;
  let staffOn=false, stuUid=null, reloadStudent=()=>{}, reloadStaff=()=>{};
  const ms=t=>t?Date.parse(t):0;
  const bk=r=>({code:r.code,studentName:r.student_name,studentId:r.student_id,uid:r.uid,section:r.section,slotId:r.slot_id,date:r.date,status:r.status,createdAt:ms(r.created_at)});
  const dk=r=>r.desk_status?{status:r.desk_status,code:r.code,date:r.date,sid:r.student_id,by:r.desk_by,byName:r.desk_by_name,at:ms(r.desk_at)}:null;
  const split=rows=>{const b={},d={};(rows||[]).forEach(r=>{b[r.id]=bk(r);const x=dk(r);if(x)d[r.id]=x});return{b,d}};
  const stuRow=r=>({id:r.id,sid:r.sid,name:r.name,college:r.college||'',phone:r.phone||'',mustChange:!!r.must_change,createdAt:ms(r.created_at),restricted:!!r.restricted,restrictedUntil:r.restricted_until||'',restrictReason:r.restrict_reason||'',verified:!!r.verified,verifiedBy:r.verified_by||'',verifiedAt:ms(r.verified_at)});
  const msgRow=r=>({id:r.id,text:r.text,at:ms(r.at),from:r.from_role,byName:r.by_name,byU:r.by_user,read:r.read,code:r.code});
  let chn=0;
  // fetch now, refetch on any change to the table (and on a timer as a safety net)
  let netCb=()=>{};
  function live(client,{table,filter,fetch,cb,poll=20000,onErr}){
    let alive=true;
    const run=async()=>{try{const v=await fetch();if(alive){cb(v);netCb(false)}}catch(e){console.warn(e);if(alive){netCb(true);onErr&&onErr(e)}}};
    run();
    const ch=client.channel('crc'+(++chn)+Math.random().toString(36).slice(2,7))
      .on('postgres_changes',{event:'*',schema:'public',table,...(filter?{filter}:{})},()=>run()).subscribe();
    const t=setInterval(run,poll);
    return()=>{alive=false;clearInterval(t);try{client.removeChannel(ch)}catch(e){}};
  }
  const must=({data,error})=>{if(error) throw error;return data};
  return{
    mode:'shared',
    onNetwork(f){netCb=f},
    setStaffMode(on){staffOn=on},

    /* settings */
    subscribeConfig(cb){return live(stu,{table:'config',poll:60000,fetch:async()=>{const r=must(await stu.from('config').select('data').eq('id',1).maybeSingle());return r?r.data:null},cb,onErr:()=>cb(undefined)})},
    async saveConfig(c){const r=must(await stf.from('config').update({data:c,updated_at:new Date().toISOString()}).eq('id',1).select('id'));if(!r||!r.length) throw {code:'invalid_argument'}},

    /* bookings */
    subscribe(date,cb,asStaff){
      if(asStaff) return live(stf,{table:'bookings',filter:`date=eq.${date}`,fetch:async()=>split(must(await stf.from('bookings').select('*').eq('date',date))),cb:v=>cb(v.b,v.d)});
      // students and visitors see seat counts only
      return live(stu,{table:'bookings',filter:`date=eq.${date}`,poll:15000,fetch:async()=>{
        const rows=must(await stu.rpc('availability',{p_date:date}));const b={},d={};let k=0;
        rows.forEach(r=>{for(let i=0;i<r.n;i++){const id=(i===0&&r.own_id)||('_a'+(k++));b[id]={_syn:true,date,slotId:r.slot_id,section:r.section,status:'booked',code:''};if(r.eff==='checked-in')d[id]={status:'checked-in',code:''}}});
        return{b,d};
      },cb:v=>cb(v.b,v.d)});
    },
    async claim(id,data){
      const {data:r,error}=await stu.rpc('book',{p_date:data.date,p_slot:data.slotId,p_section:data.section});
      if(error) return{ok:false,reason:errCode(error)};
      return{ok:true,id:r.id,row:bk(r)};
    },
    async moveBooking(id,patch){
      const {error}=await stu.rpc('move_booking',{p_id:id,p_slot:patch.slotId,p_section:patch.section});
      return error?{ok:false,reason:errCode(error)}:{ok:true};
    },
    async cancelBooking(id){must(await stu.rpc('cancel_booking',{p_id:id}))},
    watchMyBookings(sid,cb){return live(stu,{table:'bookings',filter:`student_id=eq.${sid}`,fetch:async()=>split(must(await stu.from('bookings').select('*').eq('student_id',sid))),cb:v=>cb(v.b,v.d)})},
    async setDesk(id,v){must(await stf.rpc('desk_mark',{p_id:id,p_status:v.status}))},
    async clearDesk(id){must(await stf.rpc('desk_mark',{p_id:id,p_status:null}))},

    /* students: sign-up, sign-in, profile */
    onStudent(cb){
      let alive=true;
      let watch=null;
      const stopWatch=()=>{if(watch){watch();watch=null}};
      const load=async session=>{
        if(!session){stuUid=null;stopWatch();if(alive)cb(null);return}
        const {data}=await stu.from('students').select('*').eq('id',session.user.id).maybeSingle();
        if(!alive) return;
        if(!data){stuUid=null;stopWatch();cb(null);return}
        stuUid=data.id;cb(stuRow(data));
        // keep verification / restriction status live while signed in
        if(!watch) watch=live(stu,{table:'students',filter:`id=eq.${data.id}`,poll:60000,fetch:async()=>must(await stu.from('students').select('*').eq('id',data.id).maybeSingle()),cb:r=>{if(alive&&r)cb(stuRow(r))}});
      };
      reloadStudent=async()=>{const {data}=await stu.auth.getSession();await load(data.session)};
      stu.auth.getSession().then(({data})=>load(data.session));
      const {data:{subscription}}=stu.auth.onAuthStateChange((ev,session)=>{if(ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION') return;setTimeout(()=>load(session),0)});
      return()=>{alive=false;stopWatch();subscription.unsubscribe()};
    },
    async studentRegister({sid,name,college,phone,password}){
      const {data,error}=await stu.auth.signUp({email:sEmail(sid),password});
      if(error) return{ok:false,reason:/registered|exists/i.test(error.message)?'sidTaken':'generic'};
      if(!data.session) return{ok:false,reason:'confirm'};
      const {error:e2}=await stu.from('students').insert({id:data.user.id,sid,name,college,phone});
      if(e2){await stu.auth.signOut();return{ok:false,reason:/duplicate|unique/i.test(e2.message)?'sidTaken':'generic'}}
      await reloadStudent();return{ok:true};
    },
    async studentSignIn(sid,password){
      const {data,error}=await stu.auth.signInWithPassword({email:sEmail(sid),password});
      if(error) return{ok:false,reason:'bad'};
      const {data:row}=await stu.from('students').select('*').eq('id',data.user.id).maybeSingle();
      if(!row){await stu.auth.signOut();return{ok:false,reason:'bad'}}
      await reloadStudent();return{ok:true,mustChange:!!row.must_change};
    },
    async studentSetPassword(password){
      const {error}=await stu.auth.updateUser({password});if(error) return{ok:false};
      await stu.rpc('clear_must_change');await reloadStudent();return{ok:true};
    },
    async studentChangePassword(sid,current,password){
      const {error}=await stu.auth.signInWithPassword({email:sEmail(sid),password:current});
      if(error) return{ok:false,reason:'wrongCurrent'};
      const {error:e2}=await stu.auth.updateUser({password});return e2?{ok:false,reason:'generic'}:{ok:true};
    },
    async updateProfile(p){must(await stu.rpc('update_profile',{p_name:p.name,p_college:p.college,p_phone:p.phone}));await reloadStudent()},
    async studentSignOut(){await stu.auth.signOut()},

    /* staff: sign-in and accounts */
    onStaff(cb){
      let alive=true;
      const load=async session=>{
        if(!session){if(alive)cb(null);return}
        const {data}=await stf.from('staff').select('*').eq('id',session.user.id).maybeSingle();
        if(!alive) return;
        if(!data||!data.active){await stf.auth.signOut();cb(null);return}
        cb({id:data.id,u:data.username,name:data.name,role:data.role});
      };
      reloadStaff=async()=>{const {data}=await stf.auth.getSession();await load(data.session)};
      stf.auth.getSession().then(({data})=>load(data.session));
      const {data:{subscription}}=stf.auth.onAuthStateChange((ev,session)=>{if(ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION') return;setTimeout(()=>load(session),0)});
      return()=>{alive=false;subscription.unsubscribe()};
    },
    async staffSignIn(username,password){
      const {data,error}=await stf.auth.signInWithPassword({email:tEmail(username),password});
      if(error) return{ok:false};
      const {data:row}=await stf.from('staff').select('active').eq('id',data.user.id).maybeSingle();
      if(!row||!row.active){await stf.auth.signOut();return{ok:false}}
      await reloadStaff();return{ok:true};
    },
    async staffSignOut(){await stf.auth.signOut()},
    async needsBootstrap(){return must(await stu.rpc('needs_bootstrap'))},
    async adminOp(action,payload){
      const {data,error}=await stf.functions.invoke('admin',{body:{action,...payload}});
      if(error){let code='failed';try{const j=await error.context.json();code=j.error||code}catch(e){}return{ok:false,error:code}}
      return{ok:true,...(data||{})};
    },
    watchStaffList(cb){return live(stf,{table:'staff',fetch:async()=>must(await stf.from('staff').select('*').order('created_at')).map(r=>({id:r.id,u:r.username,name:r.name,role:r.role,active:r.active})),cb})},
    async accountBySid(sid){const r=must(await stf.from('students').select('id,sid,name').eq('sid',sid).maybeSingle());return r?{uid:r.id,sid:r.sid,name:r.name}:null},
    async listAccounts(){
      const rows=must(await stf.from('students').select('*').order('name'));
      const w=must(await stf.from('warnings').select('student,deleted_at'));const cnt={};w.forEach(x=>{if(!x.deleted_at)cnt[x.student]=(cnt[x.student]||0)+1});
      return rows.map(r=>({uid:r.id,...stuRow(r),warnings:cnt[r.id]||0}));
    },
    watchWarnings(uid,cb){const c=uid===stuUid?stu:stf;return live(c,{table:'warnings',filter:`student=eq.${uid}`,fetch:async()=>must(await c.from('warnings').select('*').eq('student',uid).order('at',{ascending:false})).map(r=>({id:r.id,reason:r.reason,byName:r.by_name,at:ms(r.at),deleted:!!r.deleted_at,deletedAt:ms(r.deleted_at),deletedBy:r.deleted_by||'',deleteReason:r.delete_reason||''})),cb})},
    async adminRestrict(uid,on,until,reason){return must(await stf.rpc('admin_restrict',{p_student:uid,p_on:on,p_until:until||null,p_reason:reason||''}))},
    async adminWarn(uid,reason){return must(await stf.rpc('admin_warn',{p_student:uid,p_reason:reason}))},
    async adminDeleteWarning(id,reason){must(await stf.rpc('admin_delete_warning',{p_id:id,p_reason:reason}))},
    reloadStudent(){return reloadStudent()},
    async verifiedMap(uids){if(!uids.length) return{};const r=must(await stf.from('students').select('id,verified').in('id',uids));const m={};r.forEach(x=>m[x.id]=!!x.verified);return m},
    async verifyStudent(uid,on){must(await stf.rpc('verify_student',{p_student:uid,p_on:on}))},
    async getStudent(uid){const r=must(await stf.from('students').select('*').eq('id',uid).maybeSingle());if(!r) return null;const w=must(await stf.from('warnings').select('id,deleted_at').eq('student',uid));return{uid:r.id,...stuRow(r),warnings:w.filter(x=>!x.deleted_at).length}},

    /* messages */
    watchMessages(uid,cb){const c=uid===stuUid?stu:stf;return live(c,{table:'messages',filter:`student=eq.${uid}`,fetch:async()=>must(await c.from('messages').select('*').eq('student',uid).order('at',{ascending:false}).limit(100)).map(msgRow),cb})},
    async sendMessage(uid,msg){
      const c=msg.from==='student'?stu:stf;
      must(await c.from('messages').insert({student:uid,text:msg.text,from_role:msg.from==='student'?'student':'staff',by_name:msg.byName||'',by_user:msg.byU||'',code:msg.code||'',read:msg.from==='student'}));
    },
    async markRead(uid,id){must(await stu.rpc('mark_read',{p_id:id}))},
    watchThreads(cb){return live(stf,{table:'threads',fetch:async()=>must(await stf.from('threads').select('*').order('last_at',{ascending:false}).limit(300)).map(r=>({uid:r.student,sid:r.sid,name:r.name,lastAt:ms(r.last_at),lastText:r.last_text,lastFrom:r.last_from,staffSeenAt:ms(r.staff_seen_at)})),cb})},
    async fetchRange(from,to){return split(must(await stf.from('bookings').select('*').gte('date',from).lte('date',to).order('date').limit(5000)))},
    async scanTicket(t,force){return must(await stf.rpc('scan_ticket',{p_id:t.id||'',p_code:t.code||'',p_date:t.date||'',p_force:!!force}))},
    async markThreadSeen(uid){try{await stf.rpc('mark_thread_seen',{p_student:uid})}catch(e){}},

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
function randSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return b64(a)}
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
  return b64(bits);
}

/* ---------- QR ---------- */
/* Ticket QR payload: digits only, so a keyboard-wedge scanner types it the same in any keyboard language.
   71 | YYYYMMDD | sid length (2) | sid | code (4 chars x 2 digits) */
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function ticketPayload(b){
  const sid=String(b.studentId||b.student_id||''),code=String(b.code||''),c4=code.slice(-4).toUpperCase();
  const date=String(b.date||'').replace(/-/g,'');
  if(!/^\d{8}$/.test(date)||!/^\d{1,12}$/.test(sid)||c4.length!==4||[...c4].some(ch=>CODE_ABC.indexOf(ch)<0)) return code;
  return '71'+date+String(sid.length).padStart(2,'0')+sid+[...c4].map(ch=>String(CODE_ABC.indexOf(ch)).padStart(2,'0')).join('');
}
function parseTicket(raw){
  const t=String(raw||'').replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x660)).replace(/[\s\r\n]+/g,'').toUpperCase();
  let m=t.match(/^71(\d{4})(\d{2})(\d{2})(\d{2})(\d+)$/);
  if(m){const n=+m[4],rest=m[5];if(n>=1&&n<=12&&rest.length===n+8){const sid=rest.slice(0,n),cd=rest.slice(n);
    const chars=[0,2,4,6].map(i=>CODE_ABC[+cd.slice(i,i+2)]);
    if(chars.every(Boolean)){const date=`${m[1]}-${m[2]}-${m[3]}`;return{id:`${date}_${sid}`,code:`CRC-${m[1]}-${chars.join('')}`,date}}}}
  m=t.match(/CRC-?(\d{4})-?([A-Z0-9]{4})/);
  if(m) return{id:'',code:`CRC-${m[1]}-${m[2]}`,date:''};
  return null;
}
function qrFor(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q}catch(e){return null}}
function QR({text}){
  const svg=useMemo(()=>{const q=qrFor(text);return q?q.createSvgTag({cellSize:4,margin:0,scalable:true}):''},[text]);
  return html`<div className="qr" role="img" aria-label=${'QR '+text} dangerouslySetInnerHTML=${{__html:svg}}></div>`;
}

/* First system admin (only while none exists) */
function Bootstrap({L,lang,store,onDone}){
  const [f,setF]=useState({u:'',n:'',p:'',p2:''});const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const set=k=>e=>{const v=e.target.value;setF(s=>({...s,[k]:v}))};
  async function submit(e){
    e.preventDefault();setErr('');const u=f.u.trim().toLowerCase();
    if(!/^[a-z0-9._-]{3,24}$/.test(u)) return setErr(L.vUser);
    if(!f.n.trim()) return setErr(L.vDisp);
    if(f.p.length<8) return setErr(L.vPw);if(f.p!==f.p2) return setErr(L.vPwMatch);
    setBusy(true);
    const r=await store.adminOp('bootstrap',{username:u,name:f.n.trim(),password:f.p});
    if(!r.ok){setBusy(false);return setErr(r.error==='forbidden'?L.bootDone:L.errGeneric)}
    await store.staffSignIn(u,f.p);setBusy(false);onDone();
  }
  return html`<section className="panel loginBox" style=${{maxWidth:'480px'}}><form onSubmit=${submit} style=${{display:'grid',gap:'12px'}}>

    <button className="btn pri" disabled=${busy}>${busy?'…':L.createAdmin}</button>

function useDay(store,date,asStaff){

}
function counts(b,d,date,slotId){
  const per={};SECTIONS.forEach(s=>per[s.id]={booked:0,in:0});
  Object.entries(b).forEach(([k,x])=>{if(x.date!==date||x.slotId!==slotId) return;const st=effStatus(x,d[k]);if(!per[x.section]) return;if(st==='booked')per[x.section].booked++;else if(st==='checked-in')per[x.section].in++});
  return per;
}

function Modal({children,onClose,wide}){

  return html`<div className="scrim" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}><div className=${'modal'+(wide?' wide':'')} role="dialog" aria-modal="true">${children}</div></div>`;
}

function BookForm({L,lang,store,canWrite,me,uid,date,slot,section,onClose,onBooked,goAccount}){
  const [err,setErr]=useState(canWrite?'':L.errPerm);const [busy,setBusy]=useState(false);const [dup,setDup]=useState(false);
  async function submit(e){
    e.preventDefault();setErr('');setDup(false);
    if(!canBookSlot(date,slot)) return setErr(closedInfo(date)?L.errClosedDay:L.errClosed);
    setBusy(true);
    const id=`${date}_${me.sid}`;
    const data={code:makeCode(date),studentName:me.name,studentId:me.sid,uid,section:section.id,slotId:slot.id,date,status:'booked',createdAt:Date.now()};
    try{
      const r=await store.claim(id,data);
      if(!r.ok){setBusy(false);if(r.reason==='dup')setDup(true);if(r.reason==='restricted')store.reloadStudent();return setErr({dup:L.errDup,full:L.errFull,slot_closed:L.errClosed,closed_day:L.errClosedDay,restricted:L.errRestricted,too_far:L.errTooFar,closed_slot:L.errClosedSlot,closed_zone:L.errClosedZone}[r.reason]||L.errGeneric)}
      onBooked(r.id||id,r.row||data);
    }catch(ex){setBusy(false);setErr(ex&&ex.code==='invalid_argument'?L.errPerm:L.errGeneric)}
  }
  return html`<${Modal} onClose=${onClose}><form onSubmit=${submit} style=${{display:'grid',gap:'14px'}}>
    <div className="mh"><h2>${L.bookTitle}</h2><button type="button" className="btn ghost" onClick=${onClose} aria-label=${L.close}>✕</button></div>
    <div className="recap"><span className="tag">${section[lang]}</span><span className="tag">${longDate(date,lang)}</span><span className="tag num">${slotLabel(slot,L)}</span></div>
    <dl className="kv" style=${{margin:0}}>
      <div><dt>${L.name}</dt><dd>${me.name}</dd></div>
      <div><dt>${L.studentId}</dt><dd className="mono num" dir="ltr" style=${{textAlign:'start'}}>${me.sid}</dd></div>
    </dl>
    ${err&&html`<div className="err" role="alert">${err}${dup&&html` <button type="button" className="btn" style=${{marginTop:'8px'}} onClick=${()=>{onClose();goAccount()}}>${L.editBooking}</button>`}</div>`}
    <div className="row" style=${{justifyContent:'flex-end'}}><button type="button" className="btn" onClick=${onClose}>${L.cancel}</button><button className="btn pri" disabled=${busy}>${busy?L.booking:L.confirm}</button></div>
  </form></${Modal}>`;
}

function StudentAuth({L,store,onIn,bare,forceChange}){
  const [tab,setTab]=useState('in');
  const [f,setF]=useState({name:'',sid:'',college:'',phone:'',p:'',p2:''});
  const [err,setErr]=useState('');const [busy,setBusy]=useState(false);const [forgot,setForgot]=useState(false);
  const [changeS,setChange]=useState(false);const change=changeS||forceChange;
  const fails=useRef(0);const until=useRef(0);
  const set=k=>e=>{const v=k==='sid'?e.target.value.replace(/\D/g,''):e.target.value;setF(s=>({...s,[k]:v}))};
  async function signIn(e){
    e.preventDefault();setErr('');
    const wait=Math.ceil((until.current-Date.now())/1000);if(wait>0) return setErr(L.locked.replace('{s}',wait));
    setBusy(true);
    const r=await store.studentSignIn(f.sid.trim(),f.p);
    setBusy(false);
    if(!r.ok){fails.current++;if(fails.current>=5){until.current=Date.now()+30000;fails.current=0}setF(s=>({...s,p:''}));return setErr(L.badLogin)}
    if(r.mustChange){setChange(true);setF(s=>({...s,p:'',p2:''}));return}
    onIn&&onIn();
  }
  async function finishChange(e){
    e.preventDefault();setErr('');
    if(f.p.length<8) return setErr(L.vPw);if(f.p!==f.p2) return setErr(L.vPwMatch);
    setBusy(true);const r=await store.studentSetPassword(f.p);setBusy(false);
    if(!r.ok) return setErr(L.errGeneric);
    setChange(false);onIn&&onIn();
  }
  async function register(e){
    e.preventDefault();setErr('');
    const name=f.name.trim().replace(/\s+/g,' '),sid=f.sid.trim();
    if(name.split(' ').length<2||name.length<5) return setErr(L.errName);
    if(!/^\d{4,12}$/.test(sid)) return setErr(L.errId);
    if(f.p.length<8) return setErr(L.vPw);if(f.p!==f.p2) return setErr(L.vPwMatch);
    setBusy(true);
    const r=await store.studentRegister({sid,name,college:f.college.trim(),phone:f.phone.trim(),password:f.p});
    setBusy(false);
    if(!r.ok) return setErr(r.reason==='sidTaken'?L.sidTaken:r.reason==='confirm'?L.confirmOff:L.errGeneric);
    onIn&&onIn();
  }
  const body=change?html`<form onSubmit=${finishChange} style=${{display:'grid',gap:'12px'}}>
      <div><h3 style=${{fontSize:'16px'}}>${L.mustChangeT}</h3><p className="hint" style=${{margin:'4px 0 0'}}>${L.mustChangeH}</p></div>
      <div className="field"><label htmlFor="sa-np">${L.newPw}</label><input id="sa-np" type="password" dir="ltr" autoComplete="new-password" value=${f.p} onInput=${set('p')}/></div>
      <div className="field"><label htmlFor="sa-np2">${L.confirmPw}</label><input id="sa-np2" type="password" dir="ltr" autoComplete="new-password" value=${f.p2} onInput=${set('p2')}/></div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri" disabled=${busy}>${busy?'…':L.setPw}</button>
    </form>`:html`
    <div className="seg" role="group" style=${{justifySelf:'center'}}>
      <button type="button" aria-pressed=${tab==='in'} onClick=${()=>{setTab('in');setErr('')}}>${L.haveAcc}</button>
      <button type="button" aria-pressed=${tab==='new'} onClick=${()=>{setTab('new');setErr('')}}>${L.newAcc}</button>
    </div>
    ${tab==='in'?html`<form onSubmit=${signIn} style=${{display:'grid',gap:'12px'}}>
      <div className="field"><label htmlFor="sa-sid">${L.username} (${L.studentId})</label><input id="sa-sid" dir="ltr" className="num" inputMode="numeric" autoComplete="username" value=${f.sid} onInput=${set('sid')} required/></div>
      <div className="field"><label htmlFor="sa-p">${L.password}</label><input id="sa-p" type="password" dir="ltr" autoComplete="current-password" value=${f.p} onInput=${set('p')} required/></div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri" disabled=${busy}>${busy?'…':L.signIn}</button>
      <button type="button" className="btn ghost" style=${{justifySelf:'start',paddingInline:0}} onClick=${()=>setForgot(!forgot)}>${L.forgot}</button>
      ${forgot&&html`<div className="banner">${L.forgotText}</div>`}
    </form>`:html`<form onSubmit=${register} style=${{display:'grid',gap:'12px'}}>
      <p className="hint" style=${{margin:0}}>${L.accHint}</p>
      <div className="field"><label htmlFor="sa-n">${L.fullName}</label><input id="sa-n" autoComplete="name" value=${f.name} onInput=${set('name')} required/></div>
      <div className="field"><label htmlFor="sa-rsid">${L.username} (${L.studentId})</label><input id="sa-rsid" dir="ltr" className="num" inputMode="numeric" maxLength="12" autoComplete="username" value=${f.sid} onInput=${set('sid')} required/><span className="hint">${L.idHint}</span></div>
      <div className="two">
        <div className="field"><label htmlFor="sa-c">${L.college} <span className="hint">(${L.optional})</span></label><input id="sa-c" value=${f.college} onInput=${set('college')}/></div>
        <div className="field"><label htmlFor="sa-ph">${L.phone} <span className="hint">(${L.optional})</span></label><input id="sa-ph" dir="ltr" inputMode="tel" autoComplete="tel" value=${f.phone} onInput=${set('phone')}/></div>
      </div>
      <div className="two">
        <div className="field"><label htmlFor="sa-rp">${L.password}</label><input id="sa-rp" type="password" dir="ltr" autoComplete="new-password" value=${f.p} onInput=${set('p')} required/></div>
        <div className="field"><label htmlFor="sa-rp2">${L.confirmPw}</label><input id="sa-rp2" type="password" dir="ltr" autoComplete="new-password" value=${f.p2} onInput=${set('p2')} required/></div>
      </div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri" disabled=${busy}>${busy?'…':L.register}</button>
    </form>`}`;
  const brand=html`<${AuthBrand} lang=${L.dir==='rtl'?'ar':'en'} sub=${change?L.mustChangeT:tab==='new'?L.createAcc:L.signInStu}/>`;
  return bare?html`<div style=${{display:'grid',gap:'14px'}}>${brand}${body}</div>`:html`<section className="panel loginBox" style=${{maxWidth:'520px',display:'grid',gap:'14px'}}>${brand}${body}</section>`;
}

function Composer({L,onSend,ph}){
  const [t,setT]=useState('');const [busy,setBusy]=useState(false);
  async function go(e){e.preventDefault();const v=t.trim();if(!v||busy) return;setBusy(true);try{await onSend(v.slice(0,2000));setT('')}catch(x){}setBusy(false)}
  return html`<form className="composer" onSubmit=${go}>
    <textarea id="chat-input" className="search" rows="2" placeholder=${ph||L.chatPh} value=${t} onInput=${e=>setT(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter'&&!e.shiftKey){go(e)}}}></textarea>
    <button className="btn pri" disabled=${busy||!t.trim()}>${busy?'…':L.send}</button>
  </form>`;

function Inbox({L,lang,store,uid,me,msgs,say}){
  const unread=msgs.filter(m=>m.from!=='student'&&!m.read);

  useEffect(()=>{if(unread.length>0)setOpen(true)},[unread.length>0]);
  useEffect(()=>{if(!open) return;unread.forEach(m=>store.markRead(uid,m.id).catch(()=>{}))},[open,unread.map(m=>m.id).join()]);
  const send=async text=>{await store.sendMessage(uid,{text,at:Date.now(),from:'student',byName:me.name,read:true},{sid:me.sid,name:me.name})};
  return html`<details className="panel prof" open=${open} onToggle=${e=>setOpen(e.target.open)}>

      <${Bubbles} L=${L} lang=${lang} msgs=${msgs} mine="student"/>
      <${Composer} L=${L} onSend=${send}/>
    </div>
  </details>`;
}

      const rtl=lang==='ar';g.direction=rtl?'rtl':'ltr';g.textAlign=rtl?'right':'left';

      const tx=rtl?W-40:40;
      g.fillStyle='#5B6576';g.font='600 18px "Readex Pro", sans-serif';g.fillText((CFG.name[lang]||CFG.name.en)+' · '+L.ticket,tx,52);
      g.fillStyle='#111827';g.font='600 34px "IBM Plex Mono", monospace';g.direction='ltr';g.textAlign=rtl?'right':'left';g.fillText(b.code,tx,100);g.direction=rtl?'rtl':'ltr';
      const rows=[[L.name,b.studentName],[L.studentId,b.studentId],[L.section,sec[lang]],[L.time,longDate(b.date,lang)+' · '+slotLabel(sl,L)],[L.st_active===''?'':L.colStatus,L['st_'+badge]]];
      let y=150;rows.forEach(([k,v])=>{g.fillStyle='#5B6576';g.font='500 15px "IBM Plex Sans Arabic", sans-serif';g.fillText(k,tx,y);g.fillStyle='#111827';g.font='600 22px "IBM Plex Sans Arabic", sans-serif';g.fillText(String(v),tx,y+28);y+=54});
      const q=qrFor(ticketPayload(b));const n=q.getModuleCount();const size=260;const cell=Math.floor(size/n);const qx=rtl?40:W-40-cell*n,qy=(H-cell*n)/2+5;
      g.fillStyle='#111827';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(qx+k*cell,qy+r*cell,cell,cell);
      g.strokeStyle='#D6DCE5';g.setLineDash([8,8]);g.lineWidth=2;const lx=rtl?40+cell*n+30:W-40-cell*n-30;g.beginPath();g.moveTo(lx,30);g.lineTo(lx,H-20);g.stroke();
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      await saveFile(b.code+'.png',blob);say(L.saved);

function defaultDeskSlot(){const n=nowMin();const live=SLOTS.find(s=>n>=toMin(s.s)&&n<toMin(s.e));if(live)return live.id;const next=SLOTS.find(s=>toMin(s.s)>n);return next?next.id:(SLOTS[SLOTS.length-1]||{}).id}

function Gauge({used,inCount,L}){
  const R=70,C=2*Math.PI*R*0.75; // 270° arc
  const f=x=>Math.min(1,x/TOTAL)*C;
  const arc=(len,color,offset)=>html`<circle cx="90" cy="90" r=${R} fill="none" stroke=${color} strokeWidth="14" strokeLinecap="butt" strokeDasharray=${`${len} ${2*Math.PI*R}`} strokeDashoffset=${-offset} transform="rotate(135 90 90)"/>`;
  return html`<div className="gauge">
    <svg viewBox="0 0 180 160" aria-hidden="true">
      ${arc(C,'var(--surface-2)',0)}
      ${arc(f(inCount),'var(--accent)',0)}
      ${arc(f(used-inCount),'var(--warn)',f(inCount))}
      <text x="90" y="92" textAnchor="middle" fill="var(--fg)" style=${{font:'600 38px var(--f-display)'}} className="num">${used}</text>
      <text x="90" y="116" textAnchor="middle" fill="var(--muted)" style=${{font:'500 13px var(--f-body)'}}>${L.of} ${TOTAL}</text>
    </svg>
    <div className="legend"><span style=${{'--c':'var(--accent)'}}>${L.checkedIn} ${inCount}</span><span style=${{'--c':'var(--warn)'}}>${L.booked} ${used-inCount}</span><span style=${{'--c':'var(--surface-2)'}}>${L.free} ${TOTAL-used}</span></div>
  </div>`;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function periodSlots(p){if(p==='all') return SLOTS;if(p==='m'||p==='e') return SLOTS.filter(s=>s.shift===p);return SLOTS.filter(s=>String(s.id)===String(p))}
function periodLabel(p,L){if(p==='all') return L.wholeDay;if(p==='m') return L.morning;if(p==='e') return L.evening;const i=SLOTS.findIndex(s=>String(s.id)===String(p));return i<0?'':`${L.hour} ${i+1} (${slotLabel(SLOTS[i],L)})`}
function exportRows(b,d,from,to,period,withCancelled){
  const ids=new Set(periodSlots(period).map(s=>s.id));
  return Object.entries(b).filter(([id,x])=>!x._syn).map(([id,x])=>{const st=effStatus(x,d[id]);const sl=slotById(x.slotId);const badge=st==='booked'&&slotPhase(x.date,sl)==='ended'?'expired':st==='booked'?'active':st;return{id,...x,st,badge}})
    .filter(r=>r.date>=from&&r.date<=to&&ids.has(r.slotId)&&(withCancelled||r.st!=='cancelled'))
    .sort((a,b2)=>(a.date<b2.date?-1:a.date>b2.date?1:0)||toMin(slotById(a.slotId).s)-toMin(slotById(b2.slotId).s)||SECTIONS.findIndex(s=>s.id===a.section)-SECTIONS.findIndex(s=>s.id===b2.section)||(a.studentName||'').localeCompare(b2.studentName||''));
}
function datesBetween(from,to){const out=[];const d=new Date(from+'T12:00:00'),e=new Date(to+'T12:00:00');while(d<=e&&out.length<62){out.push(isoOf(d));d.setDate(d.getDate()+1)}return out}
async function saveFile(name,blob){
  if(window.AndroidApp&&AndroidApp.saveFile){
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});
    if(AndroidApp.saveFile(name,blob.type||'application/octet-stream',b64)) return;
    throw new Error('save failed');
  }
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare){
    try{const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}
    catch(e){if(e&&e.name==='AbortError') return}
  }
  let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(dl){await dl.save({filename:name,data:blob});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function buildCsv(rows,L,lang,from,to,period){
  const range=from!==to;
  const head=[L.rptNo,...(range?[L.rptDate]:[]),L.colTicket,L.name,L.studentId,L.section,L.hour,L.colStatus];
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const meta=range?[[L.rptFrom,from],[L.rptTo,to],[L.rptPeriod,periodLabel(period,L)],[]]:[[L.rptDay,dayLong(from,lang)],[L.rptDate,from],[L.rptPeriod,periodLabel(period,L)],[]];
  const lines=meta.map(r=>r.map(q).join(',')).concat([head.map(q).join(',')],rows.map((r,i)=>[i+1,...(range?[r.date]:[]),r.code,r.studentName,'\t'+r.studentId,secById(r.section)[lang],slotLabel(slotById(r.slotId),L),L['st_'+r.badge]].map(q).join(',')));
  return new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
}

function dateOnly(iso,lang){return new Date(iso+'T12:00:00').toLocaleDateString(lang==='ar'?'ar-OM-u-nu-latn':'en-GB',{day:'numeric',month:'long',year:'numeric'})}

function buildReportPages(rows,{from,to,period,L,lang}){

      return `<tr><td class="mono">${x}</td><td>${esc(dayLong(x,lang))}${c?` <span class="st-cancelled">(${esc(L.closedB)})</span>`:''}</td><td>${z.length}</td><td>${z.filter(r=>r.st==='checked-in').length}</td><td>${zn}</td><td>${off?Math.round((z.length-zn)/off*100)+'%':'—'}</td></tr>`})});
  tables.push({title:L.rptByZone,thead:`<tr><th>${L.section}</th><th>${L.rptSeats}</th><th>${L.booked}</th><th>${L.rptAttended}</th><th>${L['st_no-show']}</th></tr>`,
    rows:SECTIONS.map(s=>{const z=live.filter(r=>r.section===s.id);return `<tr><td>${esc(s[lang])}</td><td>${s.cap*pslots.length*openDays.length}</td><td>${z.length}</td><td>${z.filter(r=>r.st==='checked-in').length}</td><td>${z.filter(r=>r.st==='no-show').length}</td></tr>`})});
  tables.push({title:L.rptList,thead:`<tr><th>${L.rptNo}</th>${range?`<th>${L.rptDate}</th>`:''}<th>${L.colTicket}</th><th>${L.name}</th><th>${L.studentId}</th><th>${L.section}</th><th>${L.hour}</th><th>${L.colStatus}</th></tr>`,
    cls:'lst',rows:rows.map((r,i)=>`<tr><td>${i+1}</td>${range?`<td class="mono">${r.date.slice(5)}</td>`:''}<td class="mono">${esc(r.code)}</td><td class="nm">${esc(r.studentName)}</td><td class="mono">${esc(r.studentId)}</td><td>${esc(secById(r.section)[lang])}</td><td class="mono">${esc(slotLabel(slotById(r.slotId),L))}</td><td class="st-${r.badge}">${esc(L['st_'+r.badge])}</td></tr>`),
    empty:`<div class="none">${L.rptNone}</div>`});
  // pack the tables onto A4 pages (capacity counted in table rows)
  const FIRST=24,NEXT=32;const pages=[[]];let room=FIRST;
  for(const t of tables){
    if(!t.rows.length){if(room<3){pages.push([]);room=NEXT}pages[pages.length-1].push(`<div><h2>${t.title}</h2>${t.empty||''}</div>`);room-=3;continue}
    let i=0,first=true;
    while(i<t.rows.length){
      if(room<4){pages.push([]);room=NEXT}
      const k=Math.min(t.rows.length-i,room-2);
      pages[pages.length-1].push(`<div><h2>${t.title}${first?'':` (${L.rptCont})`}</h2><table class="${t.cls||''}"><thead>${t.thead}</thead><tbody>${t.rows.slice(i,i+k).join('')}</tbody></table></div>`);
      room-=k+2;i+=k;first=false;
    }
  }
  const n=pages.length;const sub=`<div class="sub">${esc(CFG.name[lang]||'')} · ${range?`${esc(from)} → ${esc(to)}`:esc(dateOnly(from,lang))} · ${esc(periodLabel(period,L))}</div>`;
  return pages.map((blocks,p)=>{
    const foot=`<div class="ft"><span>${p===n-1?`${L.rptSign}<span class="sig"></span>`:''}</span><span>${L.rptPage} ${p+1} / ${n}</span></div>`;
    return `<div class="rp" dir="${dir}" lang="${lang}">${p===0?head+meta+kp:sub}${blocks.join('')}${foot}</div>`;
  });
}
async function buildPdf(pages){
  await document.fonts.ready;
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;z-index:-1';
  host.innerHTML=`<style>${RPT_CSS}</style>`;document.body.appendChild(host);
  try{
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){
      const wrap=document.createElement('div');wrap.innerHTML=pages[i];host.appendChild(wrap);
      const canvas=await html2canvas(wrap.firstChild,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      if(i>0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,H);
      wrap.remove();
    }
    return pdf.output('blob');
  }finally{host.remove()}
}

function ExportModal({L,lang,store,b,d,date,slotId,view,onClose,say}){

  const [from,setFrom]=useState(date);const [to,setTo]=useState(()=>plus(Math.max(1,CFG.bookAhead)));
  const [rb,setRb]=useState(null);const [rd,setRd]=useState({});const [loading,setLoading]=useState(false);

  useEffect(()=>{if(mode!=='range'||badRange){setRb(null);return}let ok=true;setLoading(true);
    store.fetchRange(from,to).then(v=>{if(ok){setRb(v.b);setRd(v.d)}}).catch(()=>{if(ok)setErr(L.exportFail)}).finally(()=>{if(ok)setLoading(false)});return()=>{ok=false}},[mode,from,to]);
  const rows=mode==='one'?exportRows(b,d,f,t,period,withC):rb?exportRows(rb,rd,f,t,period,withC):[];
  const pname=period==='all'?'day':period==='m'?'morning':period==='e'?'evening':'hour'+(SLOTS.findIndex(s=>String(s.id)===String(period))+1);
  const base=mode==='one'?`${f}_${pname}`:`${f}_to_${t}_${pname}`;
  const quick=[[0,L.today],[1,L.tomorrow],[Math.max(2,CFG.bookAhead),L.windowDays.replace('{n}',Math.max(2,CFG.bookAhead)+1)]];
  async function run(kind){

      </div>

/* ---------- Ticket scanner (hardware wedge scanners such as Honeywell EDA52, or the camera) ---------- */
let _ac=null;
function beep(kind){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    const tones=kind==='ok'?[[1046,.08],[1318,.12]]:kind==='warn'?[[660,.18]]:[[220,.35]];
    let t=_ac.currentTime;
    tones.forEach(([f,d])=>{const o=_ac.createOscillator(),g=_ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(_ac.destination);o.start(t);o.stop(t+d);t+=d+.04});
  }catch(e){}
  try{if(window.AndroidApp&&AndroidApp.vibrate)AndroidApp.vibrate(kind==='ok'?60:kind==='warn'?160:400);else navigator.vibrate&&navigator.vibrate(kind==='ok'?60:kind==='warn'?[80,60,80]:[220,80,220])}catch(e){}
}
const SCAN_KIND={ok:'ok',already:'warn',early:'warn',ended:'warn',was_no_show:'warn',ambiguous:'warn',future_day:'bad',past_day:'bad',cancelled:'bad',not_found:'bad',invalid:'bad',error:'bad'};

function CameraScan({L,onResult,onClose}){
  const vid=useRef();const [err,setErr]=useState('');
  useEffect(()=>{
    let stream=null,stop=false,timer=null;
    (async()=>{
      try{
        const det=new window.BarcodeDetector({formats:['qr_code']});
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        if(stop) return;vid.current.srcObject=stream;await vid.current.play();
        const tick=async()=>{if(stop) return;try{const r=await det.detect(vid.current);if(r&&r[0]&&r[0].rawValue){onResult(r[0].rawValue);return}}catch(e){}timer=setTimeout(tick,200)};
        tick();
      }catch(e){setErr(L.camFail)}
    })();
    return()=>{stop=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop())};
  },[]);
  return html`<${Modal} onClose=${onClose}>
    <div className="mh"><h2>${L.camScan}</h2><button className="btn ghost" onClick=${onClose} aria-label=${L.close}>✕</button></div>
    ${err?html`<div className="err">${err}</div>`:html`<video ref=${vid} className="camVid" playsInline muted></video><p className="hint" style=${{margin:0,textAlign:'center'}}>${L.camHint}</p>`}
  </${Modal}>`;
}

function Scanner({L,lang,store,say,who}){
  const inp=useRef();const resRef=useRef();const timer=useRef(null);const last=useRef({raw:'',at:0});
  const [val,setVal]=useState('');const [focused,setFocused]=useState(false);const [manual,setManual]=useState(false);
  const [res,setRes]=useState(null);const [busy,setBusy]=useState(false);const [log,setLog]=useState([]);const [count,setCount]=useState(0);
  const [sound,setSound]=useState(()=>ls.get('crc.scanSound',true));const [cam,setCam]=useState(false);
  const hasCam=typeof window.BarcodeDetector!=='undefined'&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  const keep=e=>e.preventDefault();

  useEffect(()=>{focus();let lock=null;(async()=>{try{lock=await navigator.wakeLock.request('screen')}catch(e){}})();try{window.AndroidApp&&AndroidApp.keepScreenOn(true)}catch(e){}

  const submitRef=useRef(null);

  // a key pressed while the field isn't focused (e.g. right after tapping a button) still reaches it

      if(e.key&&e.key.length===1){focus();setVal(v=>v+e.key);schedule();e.preventDefault()}else if(e.key==='Enter'&&inp.current&&inp.current.value){submit(inp.current.value);e.preventDefault()}};
    document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h)},[cam]);
  function schedule(){clearTimeout(timer.current);timer.current=setTimeout(()=>{const v=inp.current?inp.current.value:'';if(!manual&&parseTicket(v))submit(v)},140)}
  async function submit(raw,force){
    clearTimeout(timer.current);
    const text=String(raw||'').trim();setVal('');if(inp.current)inp.current.value='';
    if(!text) return;

  useEffect(()=>{if(res&&resRef.current)try{resRef.current.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}},[res&&res.at]);
  async function verifyNow(){if(!res||!res.uid) return;try{await store.verifyStudent(res.uid,true);setRes(r=>({...r,verified:true}));say(L.verifiedToast)}catch(e){say(L.errGeneric)}focus()}
  const sec=res&&res.section?secById(res.section):null;const sl=res&&res.slot_id?slotById(res.slot_id):null;
  const title=r=>({ok:L.sc_ok,already:L.sc_already,early:L.sc_early,ended:L.sc_ended,was_no_show:L.sc_noshow,future_day:L.sc_future,past_day:L.sc_past,cancelled:L.sc_cancelled,not_found:L.sc_notfound,invalid:L.sc_invalid,ambiguous:L.sc_ambiguous,error:L.sc_error}[r.result]||L.sc_error);

/* ---------- Settings ---------- */
const ICON_KEYS=['ps','billiards','tt','carrom','foosball','cards','other'];
const clone=o=>JSON.parse(JSON.stringify(o));
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const M=160,k=Math.min(1,M/Math.max(img.width||M,img.height||M));
      const w=Math.max(1,Math.round((img.width||M)*k)),h=Math.max(1,Math.round((img.height||M)*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/png'));
    };img.onerror=rej;img.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function validate(c,L){
  if(!c.name.ar.trim()||!c.name.en.trim()) return L.vName;
  if(!c.sections.length) return L.vNoZone;
  for(const s of c.sections){if(!String(s.ar).trim()||!String(s.en).trim()) return L.vZoneName;const n=+s.cap;if(!Number.isInteger(n)||n<1||n>200) return L.vCap}
  if(!c.slots.length) return L.vNoHour;
  for(const s of c.slots){if(!s.s||!s.e||toMin(s.e)<=toMin(s.s)) return L.vHour}
  const so=c.slots.slice().sort((a,b)=>toMin(a.s)-toMin(b.s));
  for(let i=1;i<so.length;i++) if(toMin(so[i].s)<toMin(so[i-1].e)) return `${L.vOverlap} ${so[i-1].s}–${so[i-1].e} / ${so[i].s}–${so[i].e}`;
  for(const x of c.closed) if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')) return L.vDate;
  if(c.bookAhead===''||!(+c.bookAhead>=0&&+c.bookAhead<=30)) return L.vAhead;
  for(const x of c.closedSlots||[]){if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')) return L.vDate;if(!(x.slots||[]).length) return L.vClosedHours}
  for(const x of c.zoneClosures||[]){if(!x.section||!c.sections.some(z=>z.id===x.section)) return L.vClosedZone;if(!/^\d{4}-\d{2}-\d{2}$/.test(x.from||'')) return L.vDate;if(x.to&&x.to<x.from) return L.vRange}
  return '';
}

    <div className="zlist">${draft.slots.map((s,i)=>html`<div key=${s.id} className="hrow">
      <div className="seg">
        <button type="button" aria-pressed=${s.shift==='m'} onClick=${()=>up(d=>{d.slots[i].shift='m'})}>${L.morningS}</button>
        <button type="button" aria-pressed=${s.shift==='e'} onClick=${()=>up(d=>{d.slots[i].shift='e'})}>${L.eveningS}</button>
      </div>
      <div className="field tf"><label htmlFor=${'h-s-'+s.id}>${L.from}</label><input id=${'h-s-'+s.id} type="time" dir="ltr" value=${s.s} onInput=${e=>{const v=e.target.value;up(d=>{d.slots[i].s=v})}}/></div>
      <div className="field tf"><label htmlFor=${'h-e-'+s.id}>${L.to}</label><input id=${'h-e-'+s.id} type="time" dir="ltr" value=${s.e} onInput=${e=>{const v=e.target.value;up(d=>{d.slots[i].e=v})}}/></div>
      <button type="button" className="btn bad rm" onClick=${()=>up(d=>{d.slots.splice(i,1)})}>${L.remove}</button>
    </div>`)}</div>
    <div><button className="btn" onClick=${()=>up(d=>{const last=d.slots[d.slots.length-1];const st=last?last.e:'08:00';const em=Math.min(toMin(st)+60,23*60+59);d.slots.push({id:newSlotId(),shift:toMin(st)<720?'m':'e',s:st,e:`${pad(Math.floor(em/60))}:${pad(em%60)}`})})}>+ ${L.addHour}</button></div>
  </section>

  <section className="panel sgrid">
    <h2>${L.windowT}</h2>
    <p className="hint" style=${{margin:0}}>${L.windowHint}</p>
    <div className="roles">${[[0,L.win0],[1,L.win1],[2,L.win2]].map(([k,t])=>html`<button key=${k} type="button" className="pz" aria-pressed=${+draft.bookAhead===k} onClick=${()=>up(d=>{d.bookAhead=k})}><span><b>${t}</b></span></button>`)}
      <div className=${'pz'+(+draft.bookAhead>2?' on':'')} aria-pressed=${+draft.bookAhead>2} style=${{alignItems:'center'}}>
        <label htmlFor="st-ahead"><b>${L.winN}</b></label>
        <input id="st-ahead" type="number" min="0" max="30" inputMode="numeric" className="search num" style=${{width:'80px',padding:'6px 8px'}} value=${draft.bookAhead} onInput=${e=>{const v=e.target.value;up(d=>{d.bookAhead=v===''?'':Math.max(0,Math.min(30,parseInt(v,10)||0))})}}/>
      </div>
    </div>
    <p className="hint num" style=${{margin:0}}>${L.winPreview.replace('{n}',(+draft.bookAhead||0)+1)}</p>
  </section>

  <section className="panel sgrid">
    <h2>${L.closedDays}</h2>
    <div className="field"><label>${L.weeklyOff}</label>
      <div className="row">${L.wd.map((w,k)=>html`<button key=${k} type="button" className="chip" style=${{minWidth:'auto',padding:'7px 12px'}} aria-pressed=${draft.weeklyOff.includes(k)} onClick=${()=>up(d=>{d.weeklyOff=d.weeklyOff.includes(k)?d.weeklyOff.filter(x=>x!==k):[...d.weeklyOff,k]})}>${w}</button>`)}</div>
      ${draft.weeklyOff.length>0&&html`<div className="zlist" style=${{marginTop:'8px'}}>${[...draft.weeklyOff].sort().map(k=>html`<div key=${k} className="crow wkrow">
        <b>${L.wd[k]}</b>
        <input id=${'wk-r-'+k} className="search" placeholder=${L.weeklyReasonPh} value=${(draft.weeklyOffReasons||{})[k]||''} onInput=${e=>{const v=e.target.value;up(d=>{d.weeklyOffReasons={...(d.weeklyOffReasons||{}),[k]:v}})}} aria-label=${L.reason}/>
      </div>`)}</div>`}
    </div>
    <div className="field"><label>${L.specificDays}</label>
      ${draft.closed.length===0&&html`<span className="hint">${L.noClosed}</span>`}
      <div className="zlist">${draft.closed.map((x,i)=>html`<div key=${i} className="crow">
        <input id=${'c-d-'+i} type="date" dir="ltr" className="search" value=${x.date} onInput=${e=>{const v=e.target.value;up(d=>{d.closed[i].date=v})}} aria-label=${L.date}/>
        <input id=${'c-r-'+i} className="search" placeholder=${L.reasonPh} value=${x.reason||''} onInput=${e=>{const v=e.target.value;up(d=>{d.closed[i].reason=v})}} aria-label=${L.reason}/>
        <button type="button" className="btn bad rm" onClick=${()=>up(d=>{d.closed.splice(i,1)})}>${L.remove}</button>
      </div>`)}</div>
      <div><button className="btn" onClick=${()=>up(d=>{d.closed.push({date:todayISO(),reason:''})})}>+ ${L.addDay}</button></div>
    </div>

    <div className="field"><label>${L.closedHoursT}</label>
      <span className="hint">${L.closedHoursHint}</span>
      ${draft.closedSlots.length===0&&html`<span className="hint">${L.noClosedHours}</span>`}
      <div className="zlist">${draft.closedSlots.map((x,i)=>{const has=id=>(x.slots||[]).map(Number).includes(+id);const setSl=ids=>up(d=>{d.closedSlots[i].slots=ids});
        const shiftIds=sh=>draft.slots.filter(z=>z.shift===sh).map(z=>z.id);
        return html`<div key=${i} className="clsBox">
        <div className="row" style=${{gap:'8px'}}>
          <input id=${'cs-d-'+i} type="date" dir="ltr" className="search" style=${{width:'auto'}} value=${x.date} onInput=${e=>{const v=e.target.value;up(d=>{d.closedSlots[i].date=v})}} aria-label=${L.date}/>
          <button type="button" className="btn" onClick=${()=>setSl(shiftIds('m'))}>${L.morning}</button>
          <button type="button" className="btn" onClick=${()=>setSl(shiftIds('e'))}>${L.evening}</button>
          <button type="button" className="btn bad rm" style=${{marginInlineStart:'auto'}} onClick=${()=>up(d=>{d.closedSlots.splice(i,1)})}>${L.remove}</button>
        </div>
        <div className="chips" style=${{flexWrap:'wrap'}}>${draft.slots.map(z=>html`<button key=${z.id} type="button" className="chip num" style=${{minWidth:'auto',padding:'6px 10px'}} aria-pressed=${has(z.id)} onClick=${()=>setSl(has(z.id)?(x.slots||[]).filter(v=>+v!==+z.id):[...(x.slots||[]),z.id])}><span className="d2" style=${{fontSize:'13px'}}>${slotLabel(z,L)}</span></button>`)}</div>
        <input id=${'cs-r-'+i} className="search" placeholder=${L.closedHoursPh} value=${x.reason||''} onInput=${e=>{const v=e.target.value;up(d=>{d.closedSlots[i].reason=v})}} aria-label=${L.reason}/>
      </div>`})}</div>
      <div><button className="btn" onClick=${()=>up(d=>{d.closedSlots.push({date:todayISO(),slots:[],reason:''})})}>+ ${L.addClosedHours}</button></div>
    </div>

    <div className="field"><label>${L.closedZonesT}</label>
      <span className="hint">${L.closedZonesHint}</span>
      ${draft.zoneClosures.length===0&&html`<span className="hint">${L.noClosedZones}</span>`}
      <div className="zlist">${draft.zoneClosures.map((x,i)=>html`<div key=${i} className="clsBox">
        <div className="row" style=${{gap:'8px'}}>
          <select id=${'zc-s-'+i} className="search" style=${{flex:'1 1 160px'}} value=${x.section} onChange=${e=>{const v=e.target.value;up(d=>{d.zoneClosures[i].section=v})}} aria-label=${L.section}>
            ${draft.sections.map(z=>html`<option key=${z.id} value=${z.id}>${z[lang]||z.ar||z.en}</option>`)}
          </select>
          <button type="button" className="btn bad rm" onClick=${()=>up(d=>{d.zoneClosures.splice(i,1)})}>${L.remove}</button>
        </div>
        <div className="two">
          <div className="field"><label htmlFor=${'zc-f-'+i}>${L.rptFrom}</label><input id=${'zc-f-'+i} type="date" dir="ltr" className="search" value=${x.from||''} onInput=${e=>{const v=e.target.value;up(d=>{d.zoneClosures[i].from=v})}}/></div>
          <div className="field"><label htmlFor=${'zc-t-'+i}>${L.rptTo} <span className="hint">(${L.untilReopen})</span></label><input id=${'zc-t-'+i} type="date" dir="ltr" className="search" min=${x.from||''} value=${x.to||''} onInput=${e=>{const v=e.target.value;up(d=>{d.zoneClosures[i].to=v})}}/></div>
        </div>
        <input id=${'zc-r-'+i} className="search" placeholder=${L.closedZonePh} value=${x.reason||''} onInput=${e=>{const v=e.target.value;up(d=>{d.zoneClosures[i].reason=v})}} aria-label=${L.reason}/>
      </div>`)}</div>
      <div><button className="btn" onClick=${()=>up(d=>{d.zoneClosures.push({section:(d.sections[0]||{}).id||'',from:todayISO(),to:'',reason:''})})}>+ ${L.addClosedZone}</button></div>
    </div>
  </section>

  <div className="savebar">
    <div className="wrap row" style=${{justifyContent:'space-between'}}>
      <span className="hint">${err?html`<span style=${{color:'var(--bad)',fontWeight:600}}>${err}</span>`:dirty?L.unsaved:''}</span>
      <div className="row">
        <button className="btn ghost" onClick=${()=>{setDraft(clone(normCfg({...DEFAULT_CFG,logo:draft.logo})));setErr('')}}>${L.resetDefaults}</button>
        ${dirty&&html`<button className="btn" onClick=${()=>{setDraft(clone(cfg));setErr('')}}>${L.discard}</button>`}
        <button className="btn pri" disabled=${!dirty||busy} onClick=${save}>${busy?'…':L.saveSettings}</button>
      </div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
