<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="copyright" content="© 2026 Services Squire LLC. All rights reserved.">

</head>
<body>
<title>Rec Center Booking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column app shell — sticky header with view tabs, then a control rail (date / shift / hour) over a 7-zone floor grid; desk view swaps the grid for a gauge + roster. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE5;
  --fg:#111827; --muted:#5B6576; --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --ok:#0E9F6E; --ok-soft:#DDF5EA; --warn:#B7791F; --warn-soft:#FBEFD5; --bad:#D9344F; --bad-soft:#FBE1E6;
  --felt:#0F5F4A;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F19; --surface:#121827; --surface-2:#1A2234; --line:#263049;
  --fg:#E7EBF3; --muted:#93A0B8; --accent:#6E8FFF; --accent-ink:#0B0F19; --accent-soft:#1D2950;
  --ok:#34D399; --ok-soft:#10322A; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#FB7185; --bad-soft:#3D1A24;
  --felt:#1E8C6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F19; --surface:#121827; --surface-2:#1A2234; --line:#263049;
  --fg:#E7EBF3; --muted:#93A0B8; --accent:#6E8FFF; --accent-ink:#0B0F19; --accent-soft:#1D2950;
  --ok:#34D399; --ok-soft:#10322A; --warn:#FBBF24; --warn-soft:#3A2D10; --bad:#FB7185; --bad-soft:#3D1A24;
  --felt:#1E8C6C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:10px;background:var(--felt);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;font-weight:600;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.tabs{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lang{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px}

main{padding-block:20px 48px;display:grid;gap:20px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:13.5px}
.banner b{color:var(--warn)}
.banner.ok{background:var(--ok-soft)}.banner.ok b{color:var(--ok)}

.rail{display:grid;gap:12px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:center;min-width:64px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip .d1{display:block;font-size:12px;opacity:.8}
.chip .d2{display:block;font-family:var(--f-display);font-weight:600;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button+button{border-inline-start:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zone{position:relative;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.zone:not(:disabled):hover{border-color:var(--accent)}
.zone:disabled{cursor:not-allowed}
.zone .hd{display:flex;align-items:center;gap:10px}
.zone .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg);flex:none}
.zone h3{font-size:16px;font-weight:600;line-height:1.25}
.zone .sub{font-size:12.5px;color:var(--muted)}
.seats{display:flex;flex-wrap:wrap;gap:4px}
.seat{width:12px;height:12px;border-radius:3px;background:var(--line)}
.seat.free{background:var(--st)}
.zone .ft{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1;color:var(--st)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--stsoft);color:var(--st);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{--st:var(--ok);--stsoft:var(--ok-soft)}
.s-warn{--st:var(--warn);--stsoft:var(--warn-soft)}
.s-bad{--st:var(--bad);--stsoft:var(--bad-soft)}
.s-acc{--st:var(--accent);--stsoft:var(--accent-soft)}
.s-mut{--st:var(--muted);--stsoft:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:17px;font-weight:600;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500}
.field input,.field select,.search{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13.5px;color:var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:9px}

.scrim{position:fixed;inset:0;background:rgba(5,8,15,.55);z-index:20;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:440px;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.modal.wide{max-width:640px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal h2{font-size:19px;font-weight:600}
.recap{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:13px}

/* Ticket */
.ticket{display:grid;grid-template-columns:1fr auto;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;position:relative}
.ticket .main{padding:18px;display:grid;gap:12px;min-width:0}
.ticket .stub{padding:18px;display:grid;place-items:center;gap:8px;border-inline-start:2px dashed var(--line);position:relative;background:var(--surface-2)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--surface);inset-inline-start:-11px}
.ticket .stub::before{top:-11px}.ticket .stub::after{bottom:-11px}
.qr{width:132px;height:132px;background:#fff;padding:8px;border-radius:8px}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ticket .band{height:6px;background:var(--felt);grid-column:1/-1}
@media (max-width:520px){.ticket{grid-template-columns:1fr}.ticket .stub{border-inline-start:0;border-top:2px dashed var(--line)}.ticket .stub::before,.ticket .stub::after{display:none}}

/* Desk */
.deskTop{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px}
@media (max-width:760px){.deskTop{grid-template-columns:1fr}}
.gauge{display:grid;place-items:center;gap:6px;text-align:center}
.gauge svg{width:180px;height:auto}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.late td{background:var(--warn-soft)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none;padding-inline:16px}
.toast div{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500}
.mine{display:grid;gap:10px}
.mineRow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.logo{width:36px;height:36px;border-radius:10px;object-fit:contain;background:var(--surface-2);flex:none}
.chip.off{border-style:dashed;color:var(--muted)}
.chip.off[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.offTag{font-size:10.5px;color:var(--bad);font-weight:600}
.chip.off[aria-pressed="true"] .offTag{color:inherit}
.closedBox{background:var(--bad-soft);border-color:transparent;display:grid;gap:6px}
.closedBox h2{color:var(--bad);margin:0}

/* Settings */
.sgrid{display:grid;gap:14px}
.sgrid h2{margin:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.logoBox{width:88px;height:88px;border-radius:16px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--bg);flex:none;overflow:hidden}
.logoBox img{width:100%;height:100%;object-fit:contain}
.zlist{display:grid;gap:10px}
.zrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 92px auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.zrow input,.hrow input{background:var(--surface)}
.icons{display:flex;gap:4px;flex-wrap:wrap}
.icons button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.icons button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.icons svg{width:18px;height:18px}
.hrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hrow .tf{flex:1 1 120px;min-width:0}
.crow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:10px;align-items:center}
.rm{align-self:end}
.hrow .rm{margin-inline-start:auto}
.loginBox{max-width:420px;width:100%;margin:24px auto}
/* chat */
.chatLog{display:flex;flex-direction:column;gap:8px;max-height:380px;min-height:160px;overflow-y:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.bub{max-width:80%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;border-start-start-radius:4px;padding:8px 12px;display:grid;gap:2px}
.bub.own{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-start-start-radius:14px;border-start-end-radius:4px}
.bub .bh{font-size:11.5px;font-weight:600;color:var(--muted)}
.bub .bt{white-space:pre-wrap;overflow-wrap:anywhere}
.bub .bm{font-size:11px;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:44px}
.msgGrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;min-height:480px}
.tlist{display:grid;gap:8px;align-content:start;border-inline-end:1px solid var(--line);padding-inline-end:16px;min-width:0}
.tscroll{display:grid;gap:4px;max-height:520px;overflow-y:auto}
.trow{text-align:start;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 10px;display:grid;gap:2px;min-width:0}
.trow:hover{background:var(--surface-2)}
.trow.on{background:var(--accent-soft);border-color:var(--accent)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.tpane{display:grid;gap:10px;align-content:start;min-width:0}
.tpane .chatLog{max-height:460px;min-height:300px}
.backBtn{display:none}
@media (max-width:760px){.msgGrid{grid-template-columns:1fr}.tlist{border:0;padding:0}.msgGrid.hasSel .tlist{display:none}.msgGrid:not(.hasSel) .tpane{display:none}.backBtn{display:inline-flex}}
.authBrand{display:grid;justify-items:center;text-align:center;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.authBrand img,.authBrand .mark{width:72px;height:72px;border-radius:18px;object-fit:contain}
.authBrand img{background:var(--surface-2)}
.authBrand .nm{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.3;text-wrap:balance}
.authBrand .sb{color:var(--muted);font-size:14px}
.foot{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.foot span:first-child{font-weight:600;color:var(--fg)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.prof summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.prof summary::-webkit-details-marker{display:none}
.prof summary::after{content:"+";font-size:20px;color:var(--muted)}
.prof[open] summary::after{content:"–"}
.prof summary h2{margin:0}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;margin-inline-start:4px}
.msg{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.msg.unread{border-color:var(--accent);background:var(--accent-soft);cursor:pointer}
.pickZones{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pz{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:start}
.pz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pz:disabled{opacity:.45;cursor:not-allowed}
.chip:disabled{opacity:.45}
details summary{list-style-position:inside}
.signbar{gap:8px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pwrow{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.pwrow input{flex:1 1 180px;background:var(--surface)}
.addStaff{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;padding-top:12px;border-top:1px solid var(--line)}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
@media (max-width:860px){.zrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.zrow .iconPick{grid-column:1/-1}.zrow .rm{justify-self:start}}
@media (max-width:520px){.zrow{grid-template-columns:1fr}.crow{grid-template-columns:1fr}.crow .rm{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.zone,.chip,.btn{transition:border-color .15s,background .15s}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const {useState,useEffect,useMemo,useRef,useCallback}=React;
const html=htm.bind(React.createElement);

/* ---------- Domain ---------- */
const DEFAULT_CFG={
  name:{ar:'مركز الترفيه الطلابي',en:'Campus Recreation Center'},
  logo:'',
  sections:[
    {id:'ps',icon:'ps',cap:10,ar:'بلايستيشن',en:'PlayStation'},
    {id:'billiards',icon:'billiards',cap:20,ar:'البلياردو',en:'Billiards'},
    {id:'tt',icon:'tt',cap:4,ar:'تنس الطاولة',en:'Table Tennis'},
    {id:'carrom',icon:'carrom',cap:4,ar:'الكيرم',en:'Carrom'},
    {id:'foosball',icon:'foosball',cap:2,ar:'كرة الطاولة (فوسبول)',en:'Foosball'},
    {id:'cards',icon:'cards',cap:5,ar:'ألعاب الورق',en:'Solitaire / Cards'},
    {id:'other',icon:'other',cap:5,ar:'ألعاب أخرى',en:'Other Games'},
  ],
  slots:[
    {id:1,shift:'m',s:'07:30',e:'08:30'},{id:2,shift:'m',s:'08:30',e:'09:30'},

/* ---------- Stores ---------- */
function makeLocalStore(){
  const KEY='crc.demo.v1';
  let st=ls.get(KEY,{bookings:{},desk:{}});
  const subs=new Set();
  const save=()=>{ls.set(KEY,st);subs.forEach(f=>f())};
  const byDate=(o,date)=>Object.fromEntries(Object.entries(o).filter(([k,v])=>v.date===date));
  try{window.addEventListener('storage',e=>{if(e.key===KEY){st=ls.get(KEY,st);subs.forEach(f=>f())}})}catch(e){}
  return{
    mode:'local',
    subscribe(date,cb){const f=()=>cb(byDate(st.bookings,date),byDate(st.desk,date),true);subs.add(f);f();return()=>subs.delete(f)},
    async fetchDay(date){return{b:byDate(st.bookings,date),d:byDate(st.desk,date)}},
    async claim(id,data){
      const ex=st.bookings[id];
      if(ex&&effStatus(ex,st.desk[id])!=='cancelled') return{ok:false,reason:'dup'};
      const cnt=Object.entries(byDate(st.bookings,data.date)).filter(([k,b])=>b.slotId===data.slotId&&b.section===data.section&&occupies(effStatus(b,st.desk[k]))).length;
      if(cnt>=secById(data.section).cap) return{ok:false,reason:'full'};
      st.bookings[id]=data;save();return{ok:true};
    },
    async cancelBooking(id){if(st.bookings[id]){st.bookings[id]={...st.bookings[id],status:'cancelled'};save()}},
    async setDesk(id,v){st.desk[id]=v;save()},
    async clearDesk(id){delete st.desk[id];save()},
    async getOne(id){return{b:st.bookings[id]||null,d:st.desk[id]||null}},
    subscribeConfig(cb){const f=()=>cb(st.cfg||null);subs.add(f);f();return()=>subs.delete(f)},
    async saveConfig(c){st.cfg=c;save()},
    subscribeStaff(cb){const f=()=>cb((st.staff&&st.staff.users)||[]);subs.add(f);f();return()=>subs.delete(f)},
    async saveStaff(users){st.staff={users};save()},
    // student accounts
    watchAccount(uid,cb){const f=()=>cb(((st.accounts||{})[uid])||null);subs.add(f);f();return()=>subs.delete(f)},
    async saveAccount(uid,a){st.accounts={...(st.accounts||{}),[uid]:a};save()},
    async claimSid(sid,uid){const o=(st.sids||{})[sid];if(o&&o.uid!==uid) return false;st.sids={...(st.sids||{}),[sid]:{uid,at:Date.now()}};save();return true},
    async accountBySid(sid){const s=(st.sids||{})[sid];return s?{uid:s.uid,...((st.accounts||{})[s.uid]||{})}:null},
    watchMessages(uid,cb){const f=()=>{const m=((st.msgs||{})[uid])||{};cb(Object.entries(m).map(([id,x])=>({id,...x})).sort((a,b)=>b.at-a.at))};subs.add(f);f();return()=>subs.delete(f)},
    async sendMessage(uid,msg,meta){
      const all=st.msgs||{};const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);st.msgs={...all,[uid]:{...(all[uid]||{}),[id]:msg}};
      const th=(st.threads||{})[uid]||{uid,staffSeenAt:0};
      const patch={sid:(meta&&meta.sid)||th.sid||'',name:(meta&&meta.name)||th.name||'',lastAt:msg.at,lastText:String(msg.text).slice(0,140),lastFrom:msg.from||'staff'};
      if(msg.from!=='student') patch.staffSeenAt=msg.at;
      st.threads={...(st.threads||{}),[uid]:{...th,...patch}};save();
    },
    watchThreads(cb){const f=()=>cb(Object.entries(st.threads||{}).map(([uid,t])=>({...t,uid})).sort((a,b)=>b.lastAt-a.lastAt));subs.add(f);f();return()=>subs.delete(f)},
    async markThreadSeen(uid){const t=(st.threads||{})[uid];if(t){st.threads[uid]={...t,staffSeenAt:Date.now()};save()}},
    async markRead(uid,id){const m=(st.msgs||{})[uid];if(m&&m[id]){m[id]={...m[id],read:true};save()}},
    async adminResetPassword(uid,salt,hash){const a=(st.accounts||{})[uid];if(a){st.accounts[uid]={...a,salt,hash,mustChange:true,resetAt:Date.now()};save()}},
    async listAccounts(){return Object.entries(st.accounts||{}).map(([uid,a])=>({uid,...a}))},
    watchMyBookings(sid,cb){const f=()=>{const b={},d={};Object.entries(st.bookings).forEach(([k,x])=>{if(x.studentId===sid){b[k]=x;if(st.desk[k])d[k]=st.desk[k]}});cb(b,d)};subs.add(f);f();return()=>subs.delete(f)},
    async moveBooking(id,patch){
      const x=st.bookings[id];if(!x) return{ok:false,reason:'gone'};
      const cnt=Object.entries(byDate(st.bookings,x.date)).filter(([k,b])=>k!==id&&b.slotId===patch.slotId&&b.section===patch.section&&occupies(effStatus(b,st.desk[k]))).length;
      if(cnt>=secById(patch.section).cap) return{ok:false,reason:'full'};
      st.bookings[id]={...x,...patch,editedAt:Date.now()};save();return{ok:true};
    },
  };
}
function makeDbStore(db){
  const toMap=s=>{const o={};s.docs.forEach(x=>{if(x.exists)o[x.id]=x.data()});return o};
  return{
    mode:'shared',
    subscribe(date,cb){
      let b={},d={},gb=false;
      const u1=db.collection('bookings').where('date','==',date).onSnapshot(s=>{b=toMap(s);gb=true;cb(b,d,true)},e=>console.warn(e));
      const u2=db.collection('desk').where('date','==',date).onSnapshot(s=>{d=toMap(s);if(gb)cb(b,d,true)},e=>console.warn(e));
      return()=>{u1();u2()};
    },
    async fetchDay(date){
      const [bs,ds]=await Promise.all([db.collection('bookings').where('date','==',date).get(),db.collection('desk').where('date','==',date).get()]);
      return{b:toMap(bs),d:toMap(ds)};
    },
    async claim(id,data){
      const ref=db.doc('bookings/'+id);
      const lease=await ref.acquire({holder:data.code,ttlMs:6000});
      if(!lease.acquired) return{ok:false,reason:'busy'};
      const {b,d}=await this.fetchDay(data.date);
      if(b[id]&&effStatus(b[id],d[id])!=='cancelled') return{ok:false,reason:'dup'};
      const cnt=Object.entries(b).filter(([k,x])=>x.slotId===data.slotId&&x.section===data.section&&occupies(effStatus(x,d[k]))).length;
      if(cnt>=secById(data.section).cap) return{ok:false,reason:'full'};
      await ref.set(data);
      return{ok:true};
    },
    async cancelBooking(id){await db.doc('bookings/'+id).update({status:'cancelled',cancelledAt:Date.now()})},
    async setDesk(id,v){await db.doc('desk/'+id).set(v)},
    async clearDesk(id){await db.doc('desk/'+id).delete()},
    async getOne(id){const [b,d]=await Promise.all([db.doc('bookings/'+id).get(),db.doc('desk/'+id).get()]);return{b:b.exists?b.data():null,d:d.exists?d.data():null}},
    subscribeConfig(cb){return db.doc('config/main').onSnapshot(s=>cb(s.exists?s.data():null),e=>{console.warn(e);cb(null)})},
    async saveConfig(c){await db.doc('config/main').set(c)},
    subscribeStaff(cb){return db.doc('staff/accounts').onSnapshot(s=>cb(s.exists&&Array.isArray(s.data().users)?s.data().users:[]),e=>{console.warn(e);cb([])})},
    async saveStaff(users){await db.doc('staff/accounts').set({users,updatedAt:Date.now()})},
    // student accounts live in each viewer's own subtree: accounts/<platform uid>
    watchAccount(uid,cb){return db.doc('accounts/'+uid).onSnapshot(s=>cb(s.exists?s.data():null),e=>{console.warn(e);cb(null)})},
    async saveAccount(uid,a){await db.doc('accounts/'+uid).set(a)},
    async claimSid(sid,uid){
      const ref=db.doc('sids/'+sid);
      const lease=await ref.acquire({holder:uid,ttlMs:5000});if(!lease.acquired) return false;
      const s=await ref.get();if(s.exists&&s.data().uid&&s.data().uid!==uid) return false;
      await ref.set({uid,at:Date.now()});return true;
    },
    async accountBySid(sid){const s=await db.doc('sids/'+sid).get();if(!s.exists) return null;const uid=s.data().uid;const a=await db.doc('accounts/'+uid).get();return{uid,...(a.exists?a.data():{})}},
    // inbox/<uid>/msgs : staff write, the student reads and marks read
    watchMessages(uid,cb){return db.collection('inbox/'+uid+'/msgs').orderBy('at','desc').limit(100).onSnapshot(s=>cb(s.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()}))),e=>{console.warn(e);cb([])})},
    // a conversation = inbox/<uid>/msgs ; threads/<uid> is the index staff browse
    async sendMessage(uid,msg,meta){
      await db.collection('inbox/'+uid+'/msgs').add(msg);
      const ref=db.doc('threads/'+uid);
      const patch={sid:(meta&&meta.sid)||'',name:(meta&&meta.name)||'',lastAt:msg.at,lastText:String(msg.text).slice(0,140),lastFrom:msg.from||'staff'};
      if(msg.from!=='student') patch.staffSeenAt=msg.at;
      try{const s=await ref.get();if(s.exists) await ref.update(patch);else await ref.set({uid,staffSeenAt:0,...patch})}catch(e){console.warn(e)}
    },
    async markRead(uid,id){await db.doc('inbox/'+uid+'/msgs/'+id).update({read:true})},
    watchThreads(cb){return db.collection('threads').orderBy('lastAt','desc').limit(300).onSnapshot(s=>cb(s.docs.filter(x=>x.exists).map(x=>({uid:x.id,...x.data()}))),e=>{console.warn(e);cb([])})},
    async markThreadSeen(uid){try{await db.doc('threads/'+uid).update({staffSeenAt:Date.now()})}catch(e){}},
    // management only (rules: accounts write = owner)
    async adminResetPassword(uid,salt,hash){await db.doc('accounts/'+uid).update({salt,hash,mustChange:true,resetAt:Date.now()})},
    async listAccounts(){const s=await db.collection('accounts').limit(1000).get();return s.docs.filter(x=>x.exists).map(x=>({uid:x.id,...x.data()}))},
    watchMyBookings(sid,cb){
      let b={},d={},gb=false;
      const u1=db.collection('bookings').where('studentId','==',sid).onSnapshot(s=>{b=toMap(s);gb=true;cb(b,d)},e=>console.warn(e));
      const u2=db.collection('desk').where('sid','==',sid).onSnapshot(s=>{d=toMap(s);if(gb)cb(b,d)},e=>console.warn(e));
      return()=>{u1();u2()};
    },
    async moveBooking(id,patch){
      const ref=db.doc('bookings/'+id);
      const lease=await ref.acquire({holder:id+Date.now(),ttlMs:6000});if(!lease.acquired) return{ok:false,reason:'busy'};
      const cur=await ref.get();if(!cur.exists) return{ok:false,reason:'gone'};
      const x=cur.data();const {b,d}=await this.fetchDay(x.date);
      const cnt=Object.entries(b).filter(([k,y])=>k!==id&&y.slotId===patch.slotId&&y.section===patch.section&&occupies(effStatus(y,d[k]))).length;
      if(cnt>=secById(patch.section).cap) return{ok:false,reason:'full'};
      await ref.update({...patch,editedAt:Date.now()});return{ok:true};
    },
  };
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
function randSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return b64(a)}
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
  return b64(bits);
}

function useDay(store,date){
  const [state,setState]=useState({b:{},d:{},ready:false});
  useEffect(()=>{if(!store) return;setState({b:{},d:{},ready:false});return store.subscribe(date,(b,d)=>setState({b,d,ready:true}))},[store,date]);
  return state;
}
function counts(b,d,date,slotId){
  const per={};SECTIONS.forEach(s=>per[s.id]={booked:0,in:0});
  Object.entries(b).forEach(([k,x])=>{if(x.date!==date||x.slotId!==slotId) return;const st=effStatus(x,d[k]);if(!per[x.section]) return;if(st==='booked')per[x.section].booked++;else if(st==='checked-in')per[x.section].in++});
  return per;
}
function stateClass(left,cap){if(left<=0) return 's-bad';if(left/cap<=0.3) return 's-warn';return 's-ok'}

function Modal({children,onClose,wide}){

function BookForm({L,lang,store,canWrite,me,uid,date,slot,section,onClose,onBooked,goAccount}){
  const [err,setErr]=useState(canWrite?'':L.errPerm);const [busy,setBusy]=useState(false);const [dup,setDup]=useState(false);
  async function submit(e){
    e.preventDefault();setErr('');setDup(false);
    if(!canBookSlot(date,slot)) return setErr(closedInfo(date)?L.errClosedDay:L.errClosed);
    setBusy(true);
    const id=`${date}_${me.sid}`;
    const data={code:makeCode(date),studentName:me.name,studentId:me.sid,uid,section:section.id,slotId:slot.id,date,status:'booked',createdAt:Date.now()};
    try{
      const r=await store.claim(id,data);
      if(!r.ok){setBusy(false);if(r.reason==='dup')setDup(true);return setErr(r.reason==='dup'?L.errDup:r.reason==='full'?L.errFull:L.errBusy)}
      onBooked(id,data);
    }catch(ex){setBusy(false);setErr(ex&&ex.code==='invalid_argument'?L.errPerm:L.errGeneric)}
  }
  return html`<${Modal} onClose=${onClose}><form onSubmit=${submit} style=${{display:'grid',gap:'14px'}}>
    <div className="mh"><h2>${L.bookTitle}</h2><button type="button" className="btn ghost" onClick=${onClose} aria-label=${L.close}>✕</button></div>

    <div className="row" style=${{justifyContent:'flex-end'}}><button type="button" className="btn" onClick=${onClose}>${L.cancel}</button><button className="btn pri" disabled=${busy}>${busy?L.booking:L.confirm}</button></div>
  </form></${Modal}>`;
}

const STU_KEY='crc.stu';
const genTempPw=()=>{const A='abcdefghjkmnpqrstuvwxyz23456789';const a=new Uint32Array(8);crypto.getRandomValues(a);return Array.from(a,v=>A[v%A.length]).join('')};
const makeStuSess=(uid,a)=>({uid,sid:a.sid,v:a.hash.slice(0,12),exp:Date.now()+14*86400e3});

function StudentAuth({L,store,uid,acct,onIn,bare}){
  const [tab,setTab]=useState(acct?'in':'new');
  const [f,setF]=useState({name:'',sid:'',college:'',phone:'',p:'',p2:''});
  const [err,setErr]=useState('');const [busy,setBusy]=useState(false);const [forgot,setForgot]=useState(false);
  const [change,setChange]=useState(null); // account needing a new password
  const fails=useRef(0);const until=useRef(0);
  const set=k=>e=>{const v=k==='sid'?e.target.value.replace(/\D/g,''):e.target.value;setF(s=>({...s,[k]:v}))};
  async function signIn(e){
    e.preventDefault();setErr('');
    const wait=Math.ceil((until.current-Date.now())/1000);if(wait>0) return setErr(L.locked.replace('{s}',wait));
    setBusy(true);
    let ok=false;try{const h=await hashPw(f.p,acct&&acct.salt||'none');ok=!!acct&&acct.sid===f.sid.trim()&&h===acct.hash}catch(x){}
    setBusy(false);
    if(!ok){fails.current++;if(fails.current>=5){until.current=Date.now()+30000;fails.current=0}setF(s=>({...s,p:''}));return setErr(acct&&acct.sid!==f.sid.trim()?L.noAccHere:L.badLogin)}
    if(acct.mustChange){setChange(acct);setF(s=>({...s,p:'',p2:''}));return}
    onIn(makeStuSess(uid,acct));
  }
  async function finishChange(e){
    e.preventDefault();setErr('');
    if(f.p.length<8) return setErr(L.vPw);if(f.p!==f.p2) return setErr(L.vPwMatch);
    setBusy(true);
    try{const salt=randSalt();const hash=await hashPw(f.p,salt);const a={...change,salt,hash,mustChange:false};delete a.resetAt;await store.saveAccount(uid,a);onIn(makeStuSess(uid,a))}catch(x){setErr(L.errGeneric)}
    setBusy(false);
  }
  async function register(e){
    e.preventDefault();setErr('');
    if(acct) return setErr(L.accExists.replace('{sid}',acct.sid));
    const name=f.name.trim().replace(/\s+/g,' '),sid=f.sid.trim();
    if(name.split(' ').length<2||name.length<5) return setErr(L.errName);
    if(!/^\d{4,12}$/.test(sid)) return setErr(L.errId);
    if(f.p.length<8) return setErr(L.vPw);if(f.p!==f.p2) return setErr(L.vPwMatch);
    if(!uid) return setErr(L.errPerm);
    setBusy(true);
    try{
      const ok=await store.claimSid(sid,uid);
      if(!ok){setBusy(false);return setErr(L.sidTaken)}
      const salt=randSalt();const hash=await hashPw(f.p,salt);
      const a={sid,name,college:f.college.trim(),phone:f.phone.trim(),salt,hash,createdAt:Date.now()};
      await store.saveAccount(uid,a);onIn(makeStuSess(uid,a));
    }catch(x){setErr(x&&x.code==='invalid_argument'?L.errPerm:L.errGeneric)}
    setBusy(false);
  }
  const body=change?html`<form onSubmit=${finishChange} style=${{display:'grid',gap:'12px'}}>
      <div><h3 style=${{fontSize:'16px'}}>${L.mustChangeT}</h3><p className="hint" style=${{margin:'4px 0 0'}}>${L.mustChangeH}</p></div>
      <div className="field"><label htmlFor="sa-np">${L.newPw}</label><input id="sa-np" type="password" dir="ltr" autoComplete="new-password" value=${f.p} onInput=${set('p')}/></div>
      <div className="field"><label htmlFor="sa-np2">${L.confirmPw}</label><input id="sa-np2" type="password" dir="ltr" autoComplete="new-password" value=${f.p2} onInput=${set('p2')}/></div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri" disabled=${busy}>${busy?'…':L.setPw}</button>
    </form>`:html`
    <div className="seg" role="group" style=${{justifySelf:'center'}}>
      <button type="button" aria-pressed=${tab==='in'} onClick=${()=>{setTab('in');setErr('')}}>${L.haveAcc}</button>
      <button type="button" aria-pressed=${tab==='new'} onClick=${()=>{setTab('new');setErr('')}}>${L.newAcc}</button>
    </div>
    ${tab==='in'?html`<form onSubmit=${signIn} style=${{display:'grid',gap:'12px'}}>
      <div className="field"><label htmlFor="sa-sid">${L.username} (${L.studentId})</label><input id="sa-sid" dir="ltr" className="num" inputMode="numeric" autoComplete="username" value=${f.sid} onInput=${set('sid')} required/></div>
      <div className="field"><label htmlFor="sa-p">${L.password}</label><input id="sa-p" type="password" dir="ltr" autoComplete="current-password" value=${f.p} onInput=${set('p')} required/></div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri" disabled=${busy}>${busy?'…':L.signIn}</button>
      <button type="button" className="btn ghost" style=${{justifySelf:'start',paddingInline:0}} onClick=${()=>setForgot(!forgot)}>${L.forgot}</button>
      ${forgot&&html`<div className="banner">${L.forgotText}</div>`}
    </form>`:html`<form onSubmit=${register} style=${{display:'grid',gap:'12px'}}>
      <p className="hint" style=${{margin:0}}>${L.accHint}</p>
      <div className="field"><label htmlFor="sa-n">${L.fullName}</label><input id="sa-n" autoComplete="name" value=${f.name} onInput=${set('name')} required/></div>
      <div className="field"><label htmlFor="sa-rsid">${L.username} (${L.studentId})</label><input id="sa-rsid" dir="ltr" className="num" inputMode="numeric" maxLength="12" autoComplete="username" value=${f.sid} onInput=${set('sid')} required/><span className="hint">${L.idHint}</span></div>
      <div className="two">
        <div className="field"><label htmlFor="sa-c">${L.college} <span className="hint">(${L.optional})</span></label><input id="sa-c" value=${f.college} onInput=${set('college')}/></div>
        <div className="field"><label htmlFor="sa-ph">${L.phone} <span className="hint">(${L.optional})</span></label><input id="sa-ph" dir="ltr" inputMode="tel" autoComplete="tel" value=${f.phone} onInput=${set('phone')}/></div>
      </div>
      <div className="two">
        <div className="field"><label htmlFor="sa-rp">${L.password}</label><input id="sa-rp" type="password" dir="ltr" autoComplete="new-password" value=${f.p} onInput=${set('p')} required/></div>
        <div className="field"><label htmlFor="sa-rp2">${L.confirmPw}</label><input id="sa-rp2" type="password" dir="ltr" autoComplete="new-password" value=${f.p2} onInput=${set('p2')} required/></div>
      </div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri" disabled=${busy}>${busy?'…':L.register}</button>
    </form>`}`;
  const brand=html`<${AuthBrand} lang=${L.dir==='rtl'?'ar':'en'} sub=${change?L.mustChangeT:tab==='new'?L.createAcc:L.signInStu}/>`;
  return bare?html`<div style=${{display:'grid',gap:'14px'}}>${brand}${body}</div>`:html`<section className="panel loginBox" style=${{maxWidth:'520px',display:'grid',gap:'14px'}}>${brand}${body}</section>`;
}

function MyBookings({L,lang,store,me,say,compact,onMore}){
  const [b,setB]=useState({});const [d,setD]=useState({});const [ready,setReady]=useState(false);
  const [ticket,setTicket]=useState(null);const [edit,setEdit]=useState(null);const [ask,setAsk]=useState(null);

/* ---------- Desk ---------- */
function defaultDeskSlot(){const n=nowMin();const live=SLOTS.find(s=>n>=toMin(s.s)&&n<toMin(s.e));if(live)return live.id;const next=SLOTS.find(s=>toMin(s.s)>n);return next?next.id:(SLOTS[SLOTS.length-1]||{}).id}

function Gauge({used,inCount,L}){
  const R=70,C=2*Math.PI*R*0.75; // 270° arc
  const f=x=>Math.min(1,x/TOTAL)*C;
  const arc=(len,color,offset)=>html`<circle cx="90" cy="90" r=${R} fill="none" stroke=${color} strokeWidth="14" strokeLinecap="butt" strokeDasharray=${`${len} ${2*Math.PI*R}`} strokeDashoffset=${-offset} transform="rotate(135 90 90)"/>`;
  return html`<div className="gauge">
    <svg viewBox="0 0 180 160" aria-hidden="true">
      ${arc(C,'var(--surface-2)',0)}
      ${arc(f(inCount),'var(--accent)',0)}
      ${arc(f(used-inCount),'var(--warn)',f(inCount))}
      <text x="90" y="92" textAnchor="middle" fill="var(--fg)" style=${{font:'600 38px var(--f-display)'}} className="num">${used}</text>
      <text x="90" y="116" textAnchor="middle" fill="var(--muted)" style=${{font:'500 13px var(--f-body)'}}>${L.of} ${TOTAL}</text>
    </svg>
    <div className="legend"><span style=${{'--c':'var(--accent)'}}>${L.checkedIn} ${inCount}</span><span style=${{'--c':'var(--warn)'}}>${L.booked} ${used-inCount}</span><span style=${{'--c':'var(--surface-2)'}}>${L.free} ${TOTAL-used}</span></div>
  </div>`;
}

function Desk({L,lang,store,say,tick,who,onSignOut}){
  const [date,setDate]=useState(todayISO());
  const [slotIdRaw,setSlotId]=useState(defaultDeskSlot);
  const slotId=SLOTS.some(s=>s.id===slotIdRaw)?slotIdRaw:(SLOTS[0]||{}).id;
  const [sec,setSec]=useState('all');const [q,setQ]=useState('');const [exp,setExp]=useState(false);const [msgTo,setMsgTo]=useState(null);
  const {b,d,ready}=useDay(store,date);
  const closed=closedInfo(date);
  const per=counts(b,d,date,slotId);
  const used=SECTIONS.reduce((a,s)=>a+per[s.id].booked+per[s.id].in,0);
  const inCount=SECTIONS.reduce((a,s)=>a+per[s.id].in,0);
  const slot=slotById(slotId);
  const n=nowMin(),isToday=date===todayISO();
  const lateNow=isToday&&n>=toMin(slot.s)+LATE_MIN;

  const qq=q.trim().toLowerCase();
  const rows=Object.entries(b).map(([id,x])=>({id,...x,st:effStatus(x,d[id])}))
    .filter(r=>qq?(r.studentName.toLowerCase().includes(qq)||r.studentId.includes(qq)||r.code.toLowerCase().includes(qq)):r.slotId===slotId)
    .filter(r=>sec==='all'||r.section===sec)
    .sort((a,b2)=>a.slotId-b2.slotId||order(a.st)-order(b2.st)||a.studentName.localeCompare(b2.studentName));
  function order(s){return{booked:0,'checked-in':1,'no-show':2,cancelled:3}[s]??4}

  async function act(r,status){
    try{
      if(status===null){await store.clearDesk(r.id);return}
      await store.setDesk(r.id,{status,code:r.code,date:r.date,sid:r.studentId,at:Date.now(),by:who&&who.u?who.u:'owner',byName:who?who.name:''});
      say(status==='checked-in'?L.checkinToast:L.noshowToast);
    }catch(e){say(L.errGeneric)}
  }
  const dates=[-1,0,1].map(k=>{const x=new Date();x.setDate(x.getDate()+k);return isoOf(x)});

  return html`
  <section className="panel rail">
    <div className="row" style=${{justifyContent:'space-between'}}>
      <div className="seg">${dates.map((dt,i)=>html`<button key=${dt} aria-pressed=${dt===date} onClick=${()=>setDate(dt)}>${i===1?L.today:dayLabel(dt,lang)} <span className="num">${Number(dt.slice(8))}</span></button>`)}</div>
      <span className="hint">${longDate(date,lang)}</span>
    </div>
    <div className="chips">${SLOTS.map(s=>{const live=isToday&&n>=toMin(s.s)&&n<toMin(s.e);return html`<button key=${s.id} className="chip num" aria-pressed=${s.id===slotId} onClick=${()=>{setSlotId(s.id);setQ('')}}><span className="d1">${live?'● '+L.now:(s.shift==='m'?L.morning:L.evening).split(' ').slice(-1)[0]}</span><span className="d2" style=${{fontSize:'14px'}}>${slotLabel(s,L)}</span></button>`})}</div>
  </section>

  ${closed&&html`<div className="banner"><b>${L.closedB}</b><span>${closed.reason||L.closedWeekly}${Object.values(b).some(x=>x.status!=='cancelled')?' — '+L.bookingsWarn:''}</span></div>`}
  <section className="deskTop">
    <div className="panel"><h2>${L.occNow}</h2><${Gauge} used=${used} inCount=${inCount} L=${L}/></div>
    <div className="panel">
      <h2>${L.section}</h2>
      <div className="bars">${SECTIONS.map(s=>{const p=per[s.id];const left=s.cap-p.booked-p.in;return html`<div key=${s.id} className="bar">
        <span style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${s[lang]}</span>
        <div className="track" title=${`${p.in}/${p.booked}/${left}`}><i style=${{width:(p.in/s.cap*100)+'%',background:'var(--accent)'}}></i><i style=${{width:(p.booked/s.cap*100)+'%',background:'var(--warn)'}}></i></div>
        <span className=${'num '+stateClass(left,s.cap)} style=${{fontWeight:600,color:'var(--st)'}}>${p.booked+p.in}/${s.cap}</span>
      </div>`})}</div>
    </div>
  </section>

  <section className="panel" style=${{display:'grid',gap:'12px'}}>
    <div className="row" style=${{justifyContent:'space-between'}}><h2 style=${{margin:0}}>${qq?L.search.split(' ')[0]:L.roster} <span className="hint num">(${rows.length})</span></h2><div className="row" style=${{gap:'8px'}}>${(()=>{const t=rows.filter(r=>r.uid&&r.st!=='cancelled');return !qq&&t.length>0&&html`<button className="btn" onClick=${()=>setMsgTo(t.map(r=>({uid:r.uid,name:r.studentName,sid:r.studentId,code:r.code})))}>${L.msgAll}</button>`})()}<button className="btn pri" onClick=${()=>setExp(true)}>${L.exportBtn}</button></div></div>
    ${msgTo&&html`<${MessageModal} L=${L} store=${store} targets=${msgTo} who=${who} say=${say} onClose=${()=>setMsgTo(null)}/>`}
    ${exp&&html`<${ExportModal} L=${L} lang=${lang} b=${b} d=${d} date=${date} slotId=${slotId} say=${say} onClose=${()=>setExp(false)}/>`}
    <div className="row">
      <input id="dk-search" className="search" style=${{flex:'1 1 240px'}} placeholder=${L.search} value=${q} onInput=${e=>setQ(e.target.value)}/>
      <select id="dk-sec" className="search" style=${{flex:'0 1 200px'}} value=${sec} onChange=${e=>setSec(e.target.value)}><option value="all">${L.allSections}</option>${SECTIONS.map(s=>html`<option key=${s.id} value=${s.id}>${s[lang]}</option>`)}</select>
    </div>
    <div className="tablewrap"><table>
      <thead><tr><th>${L.colTicket}</th><th>${L.colStudent}</th><th>${L.colSection}</th>${qq&&html`<th>${L.slot}</th>`}<th>${L.colStatus}</th><th></th></tr></thead>
      <tbody>${!ready?html`<tr><td colSpan="6" className="empty">…</td></tr>`:rows.length===0?html`<tr><td colSpan="6" className="empty">${qq?L.notFound:L.none}</td></tr>`:rows.map(r=>{
        const rsl=slotById(r.slotId);const late=r.st==='booked'&&isToday&&n>=toMin(rsl.s)+LATE_MIN&&n<toMin(rsl.e)+60;
        const badge=r.st==='booked'&&slotPhase(r.date,rsl)==='ended'?'expired':r.st==='booked'?'booked':r.st;
        return html`<tr key=${r.id} className=${late?'late':''}>
          <td><span className="code" dir="ltr" style=${{fontSize:'13px'}}>${r.code}</span></td>
          <td><div style=${{fontWeight:600}}>${r.studentName}</div><div className="hint mono num" dir="ltr" style=${{textAlign:'start'}}>${r.studentId}</div></td>
          <td>${secById(r.section)[lang]}</td>
          ${qq&&html`<td className="num">${slotLabel(rsl,L)}</td>`}
          <td><span className=${'pill '+BADGE_CLS[badge]}>${L['st_'+badge]}</span>${late&&html` <span className="pill s-warn">${L.late}</span>`}${d[r.id]&&d[r.id].code===r.code&&d[r.id].by&&html`<div className="hint" style=${{fontSize:'11.5px',marginTop:'3px'}}>${L.by} ${d[r.id].byName||d[r.id].by}</div>`}</td>
          <td><div className="acts">
            ${r.st==='booked'&&html`<button className="btn ok" onClick=${()=>act(r,'checked-in')}>${L.checkIn}</button><button className="btn bad" onClick=${()=>act(r,'no-show')}>${L.noShow}</button>`}
            ${(r.st==='checked-in'||r.st==='no-show')&&html`<button className="btn ghost" onClick=${()=>act(r,null)}>${L.undo}</button>`}
            ${r.uid&&html`<button className="btn" title=${L.sendMsg} onClick=${()=>setMsgTo([{uid:r.uid,name:r.studentName,sid:r.studentId,code:r.code}])}>${L.sendMsg}</button>`}
          </div></td>
        </tr>`})}</tbody>
    </table></div>
  </section>`;
}

/* ---------- Export ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function periodSlots(p){if(p==='all') return SLOTS;if(p==='m'||p==='e') return SLOTS.filter(s=>s.shift===p);return SLOTS.filter(s=>String(s.id)===String(p))}
function periodLabel(p,L){if(p==='all') return L.wholeDay;if(p==='m') return L.morning;if(p==='e') return L.evening;const i=SLOTS.findIndex(s=>String(s.id)===String(p));return i<0?'':`${L.hour} ${i+1} (${slotLabel(SLOTS[i],L)})`}
function exportRows(b,d,date,period,withCancelled){
  const ids=new Set(periodSlots(period).map(s=>s.id));
  return Object.entries(b).map(([id,x])=>{const st=effStatus(x,d[id]);const sl=slotById(x.slotId);const badge=st==='booked'&&slotPhase(x.date,sl)==='ended'?'expired':st==='booked'?'active':st;return{id,...x,st,badge}})
    .filter(r=>r.date===date&&ids.has(r.slotId)&&(withCancelled||r.st!=='cancelled'))
    .sort((a,b2)=>toMin(slotById(a.slotId).s)-toMin(slotById(b2.slotId).s)||SECTIONS.findIndex(s=>s.id===a.section)-SECTIONS.findIndex(s=>s.id===b2.section)||a.studentName.localeCompare(b2.studentName));
}
async function saveFile(name,blob){
  let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(dl){await dl.save({filename:name,data:blob});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function buildCsv(rows,L,lang,date,period){
  const head=[L.rptNo,L.colTicket,L.name,L.studentId,L.section,L.hour,L.colStatus];
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const meta=[[L.rptDay,dayLong(date,lang)],[L.rptDate,date],[L.rptPeriod,periodLabel(period,L)],[]];
  const lines=meta.map(r=>r.map(q).join(',')).concat([head.map(q).join(',')],rows.map((r,i)=>[i+1,r.code,r.studentName,'\t'+r.studentId,secById(r.section)[lang],slotLabel(slotById(r.slotId),L),L['st_'+r.badge]].map(q).join(',')));
  return new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
}
function dayLong(iso,lang){return new Date(iso+'T12:00:00').toLocaleDateString(lang==='ar'?'ar-OM':'en-GB',{weekday:'long'})}
function dateOnly(iso,lang){return new Date(iso+'T12:00:00').toLocaleDateString(lang==='ar'?'ar-OM-u-nu-latn':'en-GB',{day:'numeric',month:'long',year:'numeric'})}

const RPT_CSS=`

function buildReportPages(rows,{b,d,date,period,L,lang}){
  const dir=T[lang].dir;
  const pslots=periodSlots(period);
  const head=`<div class="hd">${CFG.logo?`<img src="${CFG.logo}">`:`<div class="mk"></div>`}<div><h1>${esc(CFG.name[lang]||CFG.name.en)}</h1><div class="sub">${esc(L.rptTitle)}</div></div></div>`;
  const meta=`<div class="meta"><div><b>${L.rptDay}</b><span>${esc(dayLong(date,lang))}</span></div><div><b>${L.rptDate}</b><span>${esc(dateOnly(date,lang))}</span></div><div><b>${L.rptPeriod}</b><span>${esc(periodLabel(period,L))}</span></div><div><b>${L.rptGenerated}</b><span class="mono">${new Date().toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})}</span></div></div>`;
  const live=rows.filter(r=>r.st!=='cancelled');
  const att=live.filter(r=>r.st==='checked-in').length,ns=live.filter(r=>r.st==='no-show').length;
  const offered=TOTAL*pslots.length;
  const kp=`<div><h2>${L.rptSummary}</h2><div class="kpis"><div><b>${live.length}</b><span>${L.rptTotal}</span></div><div><b>${att}</b><span>${L.rptAttended}</span></div><div><b>${ns}</b><span>${L['st_no-show']}</span></div><div><b>${offered?Math.round((live.length-ns)/offered*100):0}%</b><span>${L.rptRate} · ${offered} ${L.rptSeats}</span></div></div></div>`;
  const zt=`<div><h2>${L.rptByZone}</h2><table><thead><tr><th>${L.section}</th><th>${L.rptSeats}</th><th>${L.booked}</th><th>${L.rptAttended}</th><th>${L['st_no-show']}</th></tr></thead><tbody>${SECTIONS.map(s=>{const z=live.filter(r=>r.section===s.id);return `<tr><td>${esc(s[lang])}</td><td>${s.cap*pslots.length}</td><td>${z.length}</td><td>${z.filter(r=>r.st==='checked-in').length}</td><td>${z.filter(r=>r.st==='no-show').length}</td></tr>`}).join('')}</tbody></table></div>`;
  const thead=`<thead><tr><th>${L.rptNo}</th><th>${L.colTicket}</th><th>${L.name}</th><th>${L.studentId}</th><th>${L.section}</th><th>${L.hour}</th><th>${L.colStatus}</th></tr></thead>`;
  const tr=(r,i)=>`<tr><td>${i+1}</td><td class="mono">${esc(r.code)}</td><td>${esc(r.studentName)}</td><td class="mono">${esc(r.studentId)}</td><td>${esc(secById(r.section)[lang])}</td><td class="mono">${esc(slotLabel(slotById(r.slotId),L))}</td><td class="st-${r.badge}">${esc(L['st_'+r.badge])}</td></tr>`;
  const firstCap=Math.max(4,13-SECTIONS.length), nextCap=31;
  const chunks=[];let i=0;chunks.push(rows.slice(0,firstCap));i=firstCap;while(i<rows.length){chunks.push(rows.slice(i,i+nextCap));i+=nextCap}
  const n=chunks.length;let idx=0;
  return chunks.map((ch,p)=>{
    const list=ch.length?`<table>${thead}<tbody>${ch.map(r=>tr(r,idx++)).join('')}</tbody></table>`:(p===0?`<div class="none">${L.rptNone}</div>`:'');
    const foot=`<div class="ft"><span>${p===n-1?`${L.rptSign}<span class="sig"></span>`:''}</span><span>${L.rptPage} ${p+1} / ${n}</span></div>`;
    return `<div class="rp" dir="${dir}" lang="${lang}">${p===0?head+meta+kp+zt+`<h2 style="margin-bottom:-8px">${L.rptList}</h2>`:`<div class="sub">${esc(CFG.name[lang]||'')} · ${esc(dateOnly(date,lang))} · ${esc(periodLabel(period,L))}</div>`}${list}${foot}</div>`;
  });
}
async function buildPdf(pages){
  await document.fonts.ready;
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;z-index:-1';
  host.innerHTML=`<style>${RPT_CSS}</style>`;document.body.appendChild(host);
  try{
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){
      const wrap=document.createElement('div');wrap.innerHTML=pages[i];host.appendChild(wrap);
      const canvas=await html2canvas(wrap.firstChild,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      if(i>0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,H);
      wrap.remove();
    }
    return pdf.output('blob');
  }finally{host.remove()}
}

function ExportModal({L,lang,b,d,date,slotId,onClose,say}){
  const [period,setPeriod]=useState('all');const [withC,setWithC]=useState(false);const [busy,setBusy]=useState('');const [err,setErr]=useState('');
  const rows=exportRows(b,d,date,period,withC);
  const base=`${date}_${period==='all'?'day':period==='m'?'morning':period==='e'?'evening':'hour'+(SLOTS.findIndex(s=>String(s.id)===String(period))+1)}`;
  async function run(kind){
    setErr('');setBusy(kind);
    try{
      if(kind==='csv'){await saveFile(`bookings_${base}.csv`,buildCsv(rows,L,lang,date,period))}
      else{const blob=await buildPdf(buildReportPages(rows,{b,d,date,period,L,lang}));await saveFile(`bookings_${base}.pdf`,blob)}
      say(L.exported);onClose();
    }catch(e){setErr(e&&e.code==='declined'?L.exportDeclined:L.exportFail);console.warn(e)}

        ${SLOTS.some(s=>s.shift==='m')&&html`<option value="m">${L.morning}</option>`}
        ${SLOTS.some(s=>s.shift==='e')&&html`<option value="e">${L.evening}</option>`}
        ${SLOTS.map((s,i)=>html`<option key=${s.id} value=${String(s.id)}>${L.hour} ${i+1} · ${slotLabel(s,L)}</option>`)}
      </select>
    </div>
    <label className="row" style=${{gap:'8px',fontSize:'14px'}}><input id="ex-c" type="checkbox" checked=${withC} onChange=${e=>setWithC(e.target.checked)}/>${L.includeCancelled}</label>
    <p className="hint num" style=${{margin:0}}>${rows.length} ${L.exportCount}</p>

/* ---------- Login ---------- */
function Login({L,staff,onIn}){
  const [u,setU]=useState('');const [p,setP]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const fails=useRef(0);const until=useRef(0);
  async function submit(e){
    e.preventDefault();setErr('');
    const wait=Math.ceil((until.current-Date.now())/1000);if(wait>0) return setErr(L.locked.replace('{s}',wait));
    setBusy(true);
    const acc=staff.find(x=>x.u===u.trim().toLowerCase()&&x.active!==false);
    let ok=false;try{const h=await hashPw(p,acc?acc.salt:'none');ok=!!acc&&h===acc.hash}catch(x){}
    setBusy(false);
    if(!ok){fails.current++;if(fails.current>=5){until.current=Date.now()+30000;fails.current=0}setP('');return setErr(L.badLogin)}
    onIn({u:acc.u,name:acc.name,v:acc.hash.slice(0,12),exp:Date.now()+12*3600e3});
  }
  return html`<section className="panel loginBox"><form onSubmit=${submit} style=${{display:'grid',gap:'14px'}}>
    <${AuthBrand} lang=${L.dir==='rtl'?'ar':'en'} sub=${L.loginTitle}/>
    <p className="hint" style=${{margin:0,textAlign:'center'}}>${L.loginHint}</p>

    <button className="btn pri" disabled=${busy}>${busy?'…':L.signIn}</button>
  </form></section>`;
}

function StaffAdmin({L,store,staff,say,who}){
  const [nu,setNu]=useState(()=>({u:'',name:'',p:'',p2:'',role:staff.some(x=>roleOf(x)==='admin')?'staff':'admin'}));

  const guard=(x,fn)=>{if(isLastAdmin(x)){setErr(L.lastAdmin);return}fn()};const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const [pwFor,setPwFor]=useState(null);const [pw,setPw]=useState({p:'',p2:''});const [rmFor,setRmFor]=useState(null);

      <div className="row" style=${{gap:'6px',marginInlineStart:'auto'}}>
        <button className="btn" disabled=${busy} onClick=${()=>{setPwFor(pwFor===x.u?null:x.u);setPw({p:'',p2:''});setErr('')}}>${L.resetPw}</button>
        <button className="btn" disabled=${busy} onClick=${()=>roleOf(x)==='admin'?guard(x,()=>write(staff.map(y=>y.u===x.u?{...y,role:'staff'}:y),L.staffSaved)):write(staff.map(y=>y.u===x.u?{...y,role:'admin'}:y),L.staffSaved)}>${roleOf(x)==='admin'?L.makeStaff:L.makeAdmin}</button>
        <button className="btn" disabled=${busy} onClick=${()=>x.active!==false?guard(x,()=>write(staff.map(y=>y.u===x.u?{...y,active:false}:y),L.staffSaved)):write(staff.map(y=>y.u===x.u?{...y,active:true}:y),L.staffSaved)}>${x.active!==false?L.disable:L.enable}</button>
        ${rmFor===x.u?html`<button className="btn bad" disabled=${busy} onClick=${()=>{setRmFor(null);guard(x,()=>write(staff.filter(y=>y.u!==x.u),L.staffRemoved))}}>${L.removeAsk}</button>`:html`<button className="btn bad" onClick=${()=>setRmFor(x.u)}>${L.remove}</button>`}
      </div>
      ${pwFor===x.u&&html`<div className="pwrow">
        <input id=${'pw1-'+x.u} className="search" type="password" dir="ltr" autoComplete="new-password" placeholder=${L.newPw} value=${pw.p} onInput=${e=>{const v=e.target.value;setPw(s=>({...s,p:v}))}}/>
        <input id=${'pw2-'+x.u} className="search" type="password" dir="ltr" autoComplete="new-password" placeholder=${L.confirmPw} value=${pw.p2} onInput=${e=>{const v=e.target.value;setPw(s=>({...s,p2:v}))}}/>
        <button className="btn pri" disabled=${busy} onClick=${()=>setPassword(x.u)}>${L.setPw}</button>
      </div>`}
    </div>`)}</div>
    <form className="addStaff" onSubmit=${add}>
      <div className="field"><label htmlFor="ns-u">${L.username}</label><input id="ns-u" dir="ltr" autoCapitalize="none" autoComplete="off" value=${nu.u} onInput=${e=>{const v=e.target.value;setNu(s=>({...s,u:v}))}}/></div>
      <div className="field"><label htmlFor="ns-n">${L.displayName}</label><input id="ns-n" value=${nu.name} onInput=${e=>{const v=e.target.value;setNu(s=>({...s,name:v}))}}/></div>

      <div className="field"><label htmlFor="ns-p2">${L.confirmPw}</label><input id="ns-p2" type="password" dir="ltr" autoComplete="new-password" value=${nu.p2} onInput=${e=>{const v=e.target.value;setNu(s=>({...s,p2:v}))}}/></div>

const ICON_KEYS=['ps','billiards','tt','carrom','foosball','cards','other'];
const clone=o=>JSON.parse(JSON.stringify(o));
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const M=160,k=Math.min(1,M/Math.max(img.width||M,img.height||M));
      const w=Math.max(1,Math.round((img.width||M)*k)),h=Math.max(1,Math.round((img.height||M)*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/png'));
    };img.onerror=rej;img.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function validate(c,L){
  if(!c.name.ar.trim()||!c.name.en.trim()) return L.vName;
  if(!c.sections.length) return L.vNoZone;
  for(const s of c.sections){if(!String(s.ar).trim()||!String(s.en).trim()) return L.vZoneName;const n=+s.cap;if(!Number.isInteger(n)||n<1||n>200) return L.vCap}
  if(!c.slots.length) return L.vNoHour;
  for(const s of c.slots){if(!s.s||!s.e||toMin(s.e)<=toMin(s.s)) return L.vHour}
  const so=c.slots.slice().sort((a,b)=>toMin(a.s)-toMin(b.s));
  for(let i=1;i<so.length;i++) if(toMin(so[i].s)<toMin(so[i-1].e)) return `${L.vOverlap} ${so[i-1].s}–${so[i-1].e} / ${so[i].s}–${so[i].e}`;
  for(const x of c.closed) if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')) return L.vDate;
  return '';
}

  </section>

  <section className="panel sgrid">
    <h2>${L.closedDays}</h2>
    <div className="field"><label>${L.weeklyOff}</label>
      <div className="row">${L.wd.map((w,k)=>html`<button key=${k} type="button" className="chip" style=${{minWidth:'auto',padding:'7px 12px'}} aria-pressed=${draft.weeklyOff.includes(k)} onClick=${()=>up(d=>{d.weeklyOff=d.weeklyOff.includes(k)?d.weeklyOff.filter(x=>x!==k):[...d.weeklyOff,k]})}>${w}</button>`)}</div>
    </div>
    <div className="field"><label>${L.specificDays}</label>
      ${draft.closed.length===0&&html`<span className="hint">${L.noClosed}</span>`}
      <div className="zlist">${draft.closed.map((x,i)=>html`<div key=${i} className="crow">
        <input id=${'c-d-'+i} type="date" dir="ltr" className="search" value=${x.date} onInput=${e=>{const v=e.target.value;up(d=>{d.closed[i].date=v})}} aria-label=${L.date}/>
        <input id=${'c-r-'+i} className="search" placeholder=${L.reasonPh} value=${x.reason||''} onInput=${e=>{const v=e.target.value;up(d=>{d.closed[i].reason=v})}} aria-label=${L.reason}/>
        <button type="button" className="btn bad rm" onClick=${()=>up(d=>{d.closed.splice(i,1)})}>${L.remove}</button>
      </div>`)}</div>
      <div><button className="btn" onClick=${()=>up(d=>{d.closed.push({date:todayISO(),reason:''})})}>+ ${L.addDay}</button></div>
    </div>
  </section>

  <div className="savebar">
    <div className="wrap row" style=${{justifyContent:'space-between'}}>
      <span className="hint">${err?html`<span style=${{color:'var(--bad)',fontWeight:600}}>${err}</span>`:dirty?L.unsaved:''}</span>
      <div className="row">
        <button className="btn ghost" onClick=${()=>{setDraft(clone(normCfg({...DEFAULT_CFG,logo:draft.logo})));setErr('')}}>${L.resetDefaults}</button>
        ${dirty&&html`<button className="btn" onClick=${()=>{setDraft(clone(cfg));setErr('')}}>${L.discard}</button>`}
        <button className="btn pri" disabled=${!dirty||busy} onClick=${save}>${busy?'…':L.saveSettings}</button>
      </div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
